name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests, race detector and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests with race detector
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint dashboard
        run: pnpm lint
      - name: Type-check and build dashboard
        run: pnpm build

  fresh-install:
    name: Clean Alpine install and wizard
    needs:
      - go
      - dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build clean AMD64 distribution
        run: make dist-amd64
      - name: Validate smoke-test shell syntax
        run: sh -n scripts/ci-fresh-install-smoke.sh
      - name: Install on clean Alpine and complete wizard
        run: sh scripts/ci-fresh-install-smoke.sh
      - name: Generate SHA-256 checksum
        run: sha256sum build/minimalrouter-linux-amd64.tar.gz > build/minimalrouter-linux-amd64.tar.gz.sha256
      - name: Upload verified Alpine package
        uses: actions/upload-artifact@v4
        with:
          name: minimalrouter-linux-amd64-${{ github.sha }}
          path: |
            build/minimalrouter-linux-amd64.tar.gz
            build/minimalrouter-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
