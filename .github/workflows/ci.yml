name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Home repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate release and smoke-test shell syntax
        run: |
          sh -n scripts/ci-fresh-install-smoke.sh
          sh -n scripts/checksum-file.sh
          sh -n quick-test.sh
          sh -n packaging/alpine/install-dist.sh
          sh -n packaging/alpine/slot-exec
      - name: Reject runtime inline styles and scripts
        run: |
          set -eu
          if grep -R -n -F 'style={{' web/src; then
            echo "Runtime React source must use external CSS instead of inline style objects" >&2
            exit 1
          fi
          if grep -R -n -E '<style([[:space:]>])' web/src web/index.html; then
            echo "Inline style blocks are forbidden in dashboard source" >&2
            exit 1
          fi
          if grep -R -n -E '<script([[:space:]>])' web/src; then
            echo "Inline script blocks are forbidden in React source" >&2
            exit 1
          fi
      - name: Verify required recovery and policy documentation
        run: |
          for required in \
            README.md \
            CHANGELOG.md \
            docs/README.md \
            docs/RECOVERY.md \
            docs/DEVICE_PROFILES.md \
            docs/RELEASE_SECURITY.md \
            web/public/favicon.svg
          do
            test -s "$required" || {
              echo "Required file is missing or empty: $required" >&2
              exit 1
            }
          done

  go:
    name: Go format, tests, vulnerabilities and vet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go formatting
        run: make fmt-check
      - name: Verify downloaded modules
        run: go mod verify
      - name: Run Go tests with race detector
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  dashboard:
    name: Dashboard lint, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level high
      - name: Lint dashboard
        run: pnpm lint
      - name: Run dashboard unit tests
        run: pnpm test
      - name: Type-check and build dashboard
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run dashboard E2E tests
        run: pnpm test:e2e

  fresh-install:
    name: Clean Alpine install and wizard
    needs:
      - hygiene
      - go
      - dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build clean AMD64 distribution
        run: make dist-amd64
      - name: Verify portable archive checksum
        working-directory: build
        run: sha256sum -c minimalrouter-linux-amd64.tar.gz.sha256
      - name: Validate smoke-test shell syntax
        run: sh -n scripts/ci-fresh-install-smoke.sh
      - name: Install, configure, update and roll back on clean Alpine
        run: sh scripts/ci-fresh-install-smoke.sh
      - name: Upload verified Alpine package
        uses: actions/upload-artifact@v7
        with:
          name: minimalrouter-linux-amd64-${{ github.sha }}
          path: |
            build/minimalrouter-linux-amd64.tar.gz
            build/minimalrouter-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
