name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove firewall observer against the Linux kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 file tcl
          sudo unshare --net -- python3 scripts/gh-lab/firewall_kernel_check.py
      - name: Validate release and smoke-test shell syntax
        run: |
          sh -n scripts/prepare-public-root.sh
          sh -n scripts/ci-fresh-install-smoke.sh
          sh -n scripts/checksum-file.sh
          sh -n quick-test.sh
          sh -n packaging/alpine/install-dist.sh
          sh -n packaging/alpine/install-dist_test.sh
          sh -n packaging/alpine/slot-exec
          sh -n packaging/alpine/firstboot-ready
          sh -n packaging/alpine/firstboot_test.sh
          sh -n packaging/alpine/prune-kernel-modules.sh
          sh -n packaging/alpine/prune-kernel-modules_test.sh
          sh -n packaging/alpine/check-kernel-security.sh
          sh -n packaging/alpine/check-kernel-security_test.sh
          sh -n scripts/alpine-bump.sh
          sh -n scripts/ci/alpine-release_test.sh
          sh -n scripts/ci/bootstrap-determinism.sh
          sh -n scripts/build-rust.sh
          sh -n scripts/ci/iso-validate.sh
          sh -n scripts/package-dist.sh
      - name: Test offline installer dependency mode
        run: |
          sh packaging/alpine/install-dist_test.sh
          sh packaging/alpine/firstboot_test.sh
          sh packaging/alpine/slot-exec_test.sh
          sh packaging/alpine/prune-kernel-modules_test.sh
          sh packaging/alpine/check-kernel-security_test.sh
          tclsh scripts/ci/iso-kernel-release_test.tcl
          sh scripts/ci/alpine-release_test.sh
          sh scripts/ci/iso-validate_test.sh
      - name: Reject private and runtime files
        run: |
          set -eu

          for forbidden in \
            AI_HANDOFF.md \
            SESSION6_SUMMARY.md \
            implementation_plan.md \
            data/current_config.json
          do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "Forbidden tracked path: $forbidden" >&2
              exit 1
            fi
          done

          if [ -n "$(git ls-files 'data/**')" ]; then
            echo "Runtime data directory must not be tracked:" >&2
            git ls-files 'data/**' >&2
            exit 1
          fi

          suspicious="$(git ls-files | grep -E '(^|/)(\.env(\..*)?|[^/]+\.(db|db-shm|db-wal|sqlite|sqlite3|pem|key|p12|pfx|age|backup|pcap|pcapng|iso|img|qcow2|vmdk))$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$suspicious" ]; then
            echo "Suspicious secret/runtime files are tracked:" >&2
            printf '%s\n' "$suspicious" >&2
            exit 1
          fi
      - name: Reject runtime inline styles and scripts
        run: |
          set -eu
          if grep -R -n -F 'style={{' web/src; then
            echo "Runtime React source must use external CSS instead of inline style objects" >&2
            exit 1
          fi
          if grep -R -n -E '<style([[:space:]>])' web/src web/index.html; then
            echo "Inline style blocks are forbidden in dashboard source" >&2
            exit 1
          fi
          if grep -R -n -E '<script([[:space:]>])' web/src; then
            echo "Inline script blocks are forbidden in React source" >&2
            exit 1
          fi
      - name: Verify public documentation assets
        run: |
          for required in \
            README.md \
            LICENSE \
            CHANGELOG.md \
            CODE_OF_CONDUCT.md \
            CONTRIBUTING.md \
            GOVERNANCE.md \
            PRIVACY.md \
            SECURITY.md \
            SUPPORT.md \
            docs/README.md \
            docs/INSTALLATION.md \
            docs/TROUBLESHOOTING.md \
            docs/RECOVERY.md \
            docs/DNS_FILTER.md \
            docs/RELEASE_PROCESS.md \
            docs/RELEASE_SECURITY.md \
            web/public/favicon.svg
          do
            test -s "$required" || {
              echo "Required public file is missing or empty: $required" >&2
              exit 1
            }
          done

  public-root:
    name: One-commit public candidate
    needs:
      - hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create and full-history scan clean root
        run: |
          git config user.name "Minimal Router Release CI"
          git config user.email "release-ci@users.noreply.github.com"
          sh scripts/prepare-public-root.sh HEAD /tmp/minimalrouter-public-root
      - name: Verify candidate boundary
        run: |
          test "$(git -C /tmp/minimalrouter-public-root rev-list --all --count)" = "1"
          test -z "$(git -C /tmp/minimalrouter-public-root remote)"
          test -z "$(git -C /tmp/minimalrouter-public-root tag -l)"
          test ! -e /tmp/minimalrouter-public-root/PUBLIC_RELEASE_CHECKLIST.md
          test -z "$(git -C /tmp/minimalrouter-public-root status --short)"

  rust:
    name: Rust format, warnings, tests, clippy and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Verify Rust formatting
        run: make fmt-check
      - name: Validate the 3,000-case API observer and catalogue
        run: |
          python3 -I -m unittest discover -s scripts/gh-lab -p 'test_*.py' -v
          python3 -I scripts/gh-lab/contracts.py --catalog
      - name: No compiler warnings (host and both musl targets)
        working-directory: rust
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check --workspace --all-targets --locked
          # The musl targets compile C (ring, SQLite), so cross-build with zig.
          cargo zigbuild --workspace --all-targets --locked --target x86_64-unknown-linux-musl
          cargo zigbuild --workspace --all-targets --locked --target aarch64-unknown-linux-musl
      - name: Run the workspace tests, including the Unix-only tests
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Upload API contract case results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-contract-fixture-${{ github.sha }}
          path: rust/target/contract-matrix
          if-no-files-found: error
          retention-days: 14
      - name: Run clippy
        # Informational until the warnings that predate this check are cleaned up.
        continue-on-error: true
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Scan dependencies for known vulnerabilities
        working-directory: rust
        run: cargo audit --deny warnings

  bootstrap-compatibility:
    name: Bootstrap A/B update compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check builds the baseline release tag as well as this tree.
          fetch-depth: 0
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Bootstrap programs must not embed build metadata
        run: sh scripts/ci/bootstrap-determinism.sh
      - name: Decide whether this build is deliverable as a web update
        run: sh scripts/ci/bootstrap-compatibility.sh

  dashboard-browsers:
    name: Dashboard browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's own image carries the browsers and every system library they
    # need. Installing them with apt on the runner depends on the Azure Ubuntu
    # mirror, which sometimes serves WebKit's 117 MB at a few tens of KB/s and
    # failed this job through three bounded retries. The image tag must match
    # the @playwright/test version in web/package.json (1.62.0).
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: desktop-webkit
            browser: webkit
          - project: mobile-webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production dashboard
        run: pnpm build
      - name: Check the test browser
        # A no-op while the image matches @playwright/test; after a version bump
        # that outran the image tag it downloads the matching browser from
        # Playwright's CDN (no apt) instead of failing on a missing executable.
        run: pnpm exec playwright install ${{ matrix.browser }}
      - name: Run browser E2E tests
        run: pnpm test:e2e --project=${{ matrix.project }} --workers=2
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-failure-traces-${{ matrix.project }}-${{ github.sha }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  dashboard:
    name: Dashboard lint, audit and build
    needs: dashboard-browsers
    # A failed/cancelled matrix must fail this required check, not skip it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same image as the browser matrix above: the demo E2E step needs both
    # browsers and must not depend on the runner's apt mirror either.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --ipc=host --init
    defaults:
      run:
        working-directory: web
    steps:
      - name: Require every browser profile to pass
        env:
          BROWSER_RESULT: ${{ needs.dashboard-browsers.result }}
        working-directory: .
        run: test "$BROWSER_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level high
      - name: Lint dashboard
        run: pnpm lint
      - name: Run dashboard unit tests
        run: pnpm test
      - name: Type-check and build dashboard
        run: pnpm build
      - name: Check the demo test browsers
        run: pnpm exec playwright install chromium webkit
      - name: Build GitHub Pages demo dashboard
        run: pnpm build
        env:
          VITE_DEMO_MODE: "true"
          # Vite's preview server refuses module-script requests (they always
          # carry Sec-Fetch-Dest: script) when the build sits under a non-root
          # base, so a /minimalrouter/ build cannot be served back to a real
          # browser here. Pages serves those files statically and is unaffected;
          # this step only needs the demo data, so it builds at the root base.
          VITE_BASE_PATH: "/"
      - name: Run GitHub Pages mobile demo E2E
        run: pnpm exec playwright test e2e/mobile-demo.spec.ts --project=mobile-webkit --project=mobile-chromium
        env:
          MR_DEMO_E2E: "1"

  fresh-install:
    name: Clean Alpine install and wizard
    needs:
      - public-root
      - rust
      - dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build clean AMD64 distribution
        run: make dist-amd64
      - name: Verify portable archive checksum
        working-directory: build
        run: sha256sum -c minimalrouter-linux-amd64.tar.gz.sha256
      - name: Validate smoke-test shell syntax
        run: sh -n scripts/ci-fresh-install-smoke.sh
      - name: Install, configure, update and roll back on clean Alpine
        run: sh scripts/ci-fresh-install-smoke.sh
      - name: Upload verified Alpine package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimalrouter-linux-amd64-${{ github.sha }}
          path: |
            build/minimalrouter-linux-amd64.tar.gz
            build/minimalrouter-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
