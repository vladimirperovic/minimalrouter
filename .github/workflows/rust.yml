name: Rust workspace

# Linux CI for the experimental Rust port under experiments/rust. It runs the
# whole workspace suite and the Go-versus-Rust differential tests natively on
# Linux, which the Windows development host cannot do, and builds the static
# musl binaries that the lab tests deploy. It is informational for the
# appliance: nothing here is packaged into a release.

on:
  push:
    branches:
      - "experiment/**"
    paths:
      - "experiments/rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "experiments/rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Test and build the Rust workspace on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/rust
    env:
      CARGO_TERM_COLOR: never
      MINIMALROUTER_VERSION: "0.3.3"
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go (differential test reference)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          rustc --version
          cargo --version

      - name: No compiler warnings (host and musl targets)
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check --workspace --all-targets
          cargo check --workspace --all-targets --target x86_64-unknown-linux-musl

      - name: Workspace tests, including the Unix-only tests
        run: cargo test --workspace

      - name: Differential tests against the Go implementation
        run: sh tools/parity.sh

      - name: Clippy (informational)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Build the static musl release binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --bins
          mkdir -p ../../build/rust-musl
          for bin in routerd router-applyd router-recovery router-setup router-update minimalrouter-mcp firmware-sign firmware-keygen; do
            cp "target/x86_64-unknown-linux-musl/release/$bin" ../../build/rust-musl/
          done
          {
            echo '### Release binary sizes (bytes)'
            echo
            echo '| Binary | Size |'
            echo '|---|---:|'
            for f in ../../build/rust-musl/*; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(stat -c %s "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Privilege boundary stays split in the binaries
        run: |
          # Panic-location strings keep each crate's source paths in the binary.
          ! grep -aq 'crates/mr-applyd' ../../build/rust-musl/routerd
          ! grep -aq 'crates/mr-api' ../../build/rust-musl/router-applyd
          # The static binaries must not need a dynamic loader.
          for f in ../../build/rust-musl/*; do
            ! readelf -l "$f" | grep -q 'Requesting program interpreter'
          done

      - name: Upload the musl binaries for lab tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-musl-binaries-${{ github.sha }}
          path: build/rust-musl/
          retention-days: 14
          if-no-files-found: error
