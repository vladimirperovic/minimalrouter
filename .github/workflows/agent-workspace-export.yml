name: Apply reviewed fixes

on:
  push:
    branches:
      - ai/gemini-security-reliability-fixes

permissions:
  contents: write

concurrency:
  group: apply-reviewed-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply reviewed patch when present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f agent-fix.patch ]; then
            echo "No patch payload in this commit; nothing to apply."
            exit 0
          fi
          git apply --index --whitespace=error-all agent-fix.patch
          git rm agent-fix.patch
          git rm .github/workflows/agent-workspace-export.yml
          git config user.name "OpenAI Review Agent"
          git config user.email "review-agent@users.noreply.github.com"
          git commit -m "fix: address security and reliability review blockers"
          git push origin HEAD:ai/gemini-security-reliability-fixes
