name: Agent workspace export

on:
  push:
    branches:
      - ai/gemini-security-reliability-fixes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-workspace-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Package workspace including Git metadata
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./workspace.tar.gz' -czf workspace.tar.gz .
      - name: Upload workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minimalrouter-agent-workspace-${{ github.sha }}
          path: workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
