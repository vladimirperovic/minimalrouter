name: Sync validated public recovery hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sync-validated-public.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/sync-privileged-recovery-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private branch
        uses: actions/checkout@v7
        with:
          ref: agent/sync-privileged-recovery-v3
          fetch-depth: 0

      - name: Download exact validated public merge
        shell: bash
        run: |
          set -euo pipefail
          public_sha=1eda8073b6d005dfa5bdb5673c227a991442cdb6
          curl --fail --location --retry 3 \
            "https://github.com/vladimirperovic/minimalrouter/archive/${public_sha}.tar.gz" \
            --output /tmp/minimalrouter-public.tar.gz
          mkdir -p /tmp/minimalrouter-public
          tar -xzf /tmp/minimalrouter-public.tar.gz \
            --strip-components=1 \
            -C /tmp/minimalrouter-public

      - name: Copy approved source, tests, packaging, and technical docs
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/minimalrouter-public
          files=(
            ARCHITECTURE.md
            SECURITY.md
            cmd/router-applyd/startup_reconcile.go
            cmd/router-applyd/startup_reconcile_test.go
            cmd/router-applyd/confirmation.go
            cmd/router-applyd/confirmation_test.go
            cmd/router-applyd/main.go
            cmd/router-applyd/outcome.go
            cmd/router-applyd/outcome_test.go
            cmd/router-applyd/persistence_outcome_test.go
            cmd/router-applyd/persistence_validation_test.go
            cmd/router-applyd/reconcile_override_test.go
            internal/apply/failure_scenarios_round2_test.go
            internal/apply/failure_scenarios_test.go
            internal/apply/ipc.go
            internal/apply/recovery_required_test.go
            internal/apply/response_validation_test.go
            internal/apply/statemachine.go
            internal/apply/statemachine_test.go
            internal/apply/two_phase_confirmation_test.go
            packaging/alpine/router-applyd.initd
            scripts/ci-fresh-install-smoke.sh
            docs/FAILURE_SCENARIOS.md
            docs/RECOVERY.md
            docs/TESTING.md
          )
          for path in "${files[@]}"; do
            test -f "$src/$path"
            mkdir -p "$(dirname "$path")"
            cp "$src/$path" "$path"
          done

      - name: Verify private-only material was preserved
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/PROXMOX_AI_HANDOFF.md
          test -z "$(git status --short -- docs/PROXMOX_AI_HANDOFF.md)"
          test -z "$(git status --short -- .github/workflows/release.yml)"

      - name: Commit exact public blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            ARCHITECTURE.md SECURITY.md \
            cmd/router-applyd internal/apply \
            packaging/alpine/router-applyd.initd \
            scripts/ci-fresh-install-smoke.sh \
            docs/FAILURE_SCENARIOS.md docs/RECOVERY.md docs/TESTING.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "sync: import validated public recovery hardening"
          git push
