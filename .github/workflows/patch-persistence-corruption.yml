name: Patch persistence corruption hardening

on:
  push:
    branches:
      - agent/failure-hardening-round2
    paths:
      - .github/workflows/patch-persistence-corruption.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/failure-hardening-round2
      - name: Apply reviewed persistence hardening
        shell: python
        run: |
          from pathlib import Path

          outcome = Path("cmd/router-applyd/outcome.go")
          text = outcome.read_text()
          text = text.replace(
              'import "github.com/vladimirperovic/minimalrouter/internal/apply"',
              '''import (
          \t"errors"
          \t"fmt"
          \t"os"

          \t"github.com/vladimirperovic/minimalrouter/internal/apply"
          \t"github.com/vladimirperovic/minimalrouter/internal/config"
          )''',
              1,
          )
          addition = '''
          func replayTransactionResponse(id, configHash string, previous *transactionRecord, loadErr error) (*apply.ApplyResponse, bool) {
          \tif loadErr != nil {
          \t\tif errors.Is(loadErr, os.ErrNotExist) {
          \t\t\treturn nil, false
          \t\t}
          \t\tresponse := recoveryFailure(id, "transaction journal could not be read; canonical reconciliation is required")
          \t\treturn &response, true
          \t}
          \tif previous == nil {
          \t\tresponse := recoveryFailure(id, "transaction journal returned no record; canonical reconciliation is required")
          \t\treturn &response, true
          \t}
          \tif previous.ID != id {
          \t\treturn nil, false
          \t}
          \tif previous.ConfigHash != configHash {
          \t\tresponse := failure(id, "transaction ID was already used for different content", false)
          \t\treturn &response, true
          \t}
          \tresponse := previous.Response
          \treturn &response, true
          }

          func normalizeLastGood(previous *config.SystemConfig, loadErr error) (*config.SystemConfig, error) {
          \tif loadErr != nil {
          \t\tif errors.Is(loadErr, os.ErrNotExist) {
          \t\t\treturn nil, nil
          \t\t}
          \t\treturn nil, fmt.Errorf("read last-good configuration: %w", loadErr)
          \t}
          \tif previous == nil {
          \t\treturn nil, errors.New("last-good loader returned no configuration")
          \t}
          \treturn previous, nil
          }

          func pendingLoadFailure(id string, loadErr error) apply.ApplyResponse {
          \tif errors.Is(loadErr, os.ErrNotExist) {
          \t\treturn failure(id, "no configuration is awaiting confirmation", false)
          \t}
          \treturn recoveryFailure(id, "pending confirmation state could not be read; canonical reconciliation is required")
          }
          '''
          if "func replayTransactionResponse" in text:
              raise SystemExit("persistence helpers already exist")
          outcome.write_text(text + addition)

          main = Path("cmd/router-applyd/main.go")
          text = main.read_text()
          replacements = [
              ('''\tif previous, err := loadLastTransaction(); err == nil && previous.ID == req.ID {
          \t\tif previous.ConfigHash != configHash {
          \t\t\twriteResponse(conn, failure(req.ID, "transaction ID was already used for different content", false))
          \t\t\treturn
          \t\t}
          \t\twriteResponse(conn, previous.Response)
          \t\treturn
          \t}''', '''\tprevious, loadErr := loadLastTransaction()
          \tif replay, handled := replayTransactionResponse(req.ID, configHash, previous, loadErr); handled {
          \t\twriteResponse(conn, *replay)
          \t\treturn
          \t}'''),
              ('''\tpreviousConfig, _ := loadLastGood()
          \tif req.RequireConfirmation && !confirmationModeAllowed(previousConfig, req.Config) {''', '''\tloadedPrevious, previousErr := loadLastGood()
          \tpreviousConfig, previousErr := normalizeLastGood(loadedPrevious, previousErr)
          \tif previousErr != nil {
          \t\treturn recoveryFailure(req.ID, "last-good configuration could not be read; canonical reconciliation is required")
          \t}
          \tif req.RequireConfirmation && !confirmationModeAllowed(previousConfig, req.Config) {'''),
              ('''\tpending, err := loadPendingConfirmation()
          \tif err != nil {
          \t\treturn failure(req.ID, "no configuration is awaiting confirmation", false)
          \t}''', '''\tpending, err := loadPendingConfirmation()
          \tif err != nil {
          \t\treturn pendingLoadFailure(req.ID, err)
          \t}'''),
              ('''\tif err := configureRuntimeLAN(req.Config); err != nil {
          \t\treturn failure(req.ID, "could not finalize LAN address", false)
          \t}
          \tif err := saveLastGood(req.Config); err != nil {
          \t\treturn failure(req.ID, "could not persist confirmed configuration", false)
          \t}
          \tif err := os.Remove(pendingPath); err != nil && !errors.Is(err, os.ErrNotExist) {
          \t\treturn failure(req.ID, "could not clear pending confirmation", false)
          \t}
          \tif err := verifyActive(req.Config); err != nil {
          \t\treturn failure(req.ID, "confirmed configuration verification failed", false)
          \t}''', '''\tif err := configureRuntimeLAN(req.Config); err != nil {
          \t\treturn recoveryFailure(req.ID, "could not finalize LAN address; verified rollback is required")
          \t}
          \tif err := saveLastGood(req.Config); err != nil {
          \t\treturn recoveryFailure(req.ID, "could not persist confirmed configuration; verified rollback is required")
          \t}
          \tif err := os.Remove(pendingPath); err != nil && !errors.Is(err, os.ErrNotExist) {
          \t\treturn recoveryFailure(req.ID, "could not clear pending confirmation; canonical reconciliation is required")
          \t}
          \tif err := verifyActive(req.Config); err != nil {
          \t\treturn recoveryFailure(req.ID, "confirmed configuration verification failed; verified rollback is required")
          \t}'''),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"main persistence block was not unique: {old[:100]!r}")
              text = text.replace(old, new, 1)
          main.write_text(text)

          state = Path("internal/apply/statemachine.go")
          text = state.read_text()
          old = '''\tresp, err := e.applyPrivileged(ctx, req)
          \tcancel()
          \tif err != nil || !resp.Success || !resp.Verified {
          \t\treturn pending.tx, fmt.Errorf("privileged confirmation failed")
          \t}'''
          new = '''\tresp, err := e.applyPrivileged(ctx, req)
          \tcancel()
          \tif err != nil {
          \t\tpending.tx.CurrentState = StateRecoveryRequired
          \t\tpending.tx.Error = fmt.Sprintf("privileged confirmation outcome is unknown; verified rollback or retry is required: %v", err)
          \t\treturn pending.tx, fmt.Errorf("privileged confirmation failed: %w", err)
          \t}
          \tif !resp.Success || !resp.Verified {
          \t\tpending.tx.CurrentState = StateRecoveryRequired
          \t\tpending.tx.Error = "privileged confirmation failed; verified rollback or retry is required: " + resp.Error
          \t\treturn pending.tx, fmt.Errorf("privileged confirmation failed: %s", resp.Error)
          \t}'''
          if text.count(old) != 1:
              raise SystemExit("confirmation failure block was not uniquely identified")
          state.write_text(text.replace(old, new, 1))
      - name: Add persistence corruption tests
        shell: bash
        run: |
          cat > cmd/router-applyd/persistence_outcome_test.go <<'EOF'
          package main

          import (
          	"errors"
          	"os"
          	"testing"

          	"github.com/vladimirperovic/minimalrouter/internal/apply"
          	"github.com/vladimirperovic/minimalrouter/internal/config"
          )

          func TestReplayTransactionResponseFailsClosedOnUnreadableJournal(t *testing.T) {
          	response, handled := replayTransactionResponse("tx-corrupt", "hash", nil, errors.New("corrupt JSON"))
          	if !handled || response == nil || !response.RecoveryRequired {
          		t.Fatalf("unreadable journal did not require recovery: handled=%v response=%+v", handled, response)
          	}
          }

          func TestReplayTransactionResponseAllowsMissingJournal(t *testing.T) {
          	response, handled := replayTransactionResponse("tx-new", "hash", nil, os.ErrNotExist)
          	if handled || response != nil {
          		t.Fatalf("missing journal should allow a new request: handled=%v response=%+v", handled, response)
          	}
          }

          func TestReplayTransactionResponseReturnsPersistedResult(t *testing.T) {
          	stored := &transactionRecord{
          		ID: "tx-existing", ConfigHash: "same",
          		Response: apply.ApplyResponse{ID: "tx-existing", Success: true, Verified: true},
          	}
          	response, handled := replayTransactionResponse("tx-existing", "same", stored, nil)
          	if !handled || response == nil || !response.Success || !response.Verified {
          		t.Fatalf("persisted response was not replayed: handled=%v response=%+v", handled, response)
          	}
          }

          func TestNormalizeLastGoodRejectsCorruptionButAllowsFreshInstall(t *testing.T) {
          	if previous, err := normalizeLastGood(nil, os.ErrNotExist); err != nil || previous != nil {
          		t.Fatalf("fresh install was rejected: previous=%+v err=%v", previous, err)
          	}
          	if _, err := normalizeLastGood(nil, errors.New("invalid last-good JSON")); err == nil {
          		t.Fatal("corrupt last-good state was accepted")
          	}
          	cfg := config.DefaultConfig()
          	if previous, err := normalizeLastGood(&cfg, nil); err != nil || previous == nil {
          		t.Fatalf("valid last-good state was rejected: %v", err)
          	}
          }

          func TestPendingLoadFailureDistinguishesMissingFromCorrupt(t *testing.T) {
          	missing := pendingLoadFailure("tx-missing", os.ErrNotExist)
          	if missing.RecoveryRequired || missing.RolledBack || missing.Success {
          		t.Fatalf("missing pending state should be an ordinary rejection: %+v", missing)
          	}
          	corrupt := pendingLoadFailure("tx-corrupt", errors.New("corrupt pending JSON"))
          	if !corrupt.RecoveryRequired || corrupt.RolledBack || corrupt.Success {
          		t.Fatalf("corrupt pending state must require recovery: %+v", corrupt)
          	}
          }
          EOF

          cat >> internal/apply/failure_scenarios_round2_test.go <<'EOF'

          func TestConfirmationHelperFailureSurfacesRecoveryRequired(t *testing.T) {
          	initial := config.DefaultConfig()
          	client := &scenarioApplyClient{steps: []scenarioApplyStep{
          		successfulScenarioStep(),
          		{response: ApplyResponse{Success: false, RecoveryRequired: true, Error: "pending state is corrupt"}},
          	}}
          	engine := NewEngineWithClient(initial, nil, client)
          	tx, err := engine.ProcessTransaction("tx-confirm-helper-failure", candidateWithNewLAN(initial))
          	if err != nil {
          		t.Fatalf("create pending transaction: %v", err)
          	}
          	defer func() {
          		if engine.pending != nil && engine.pending.timer != nil {
          			engine.pending.timer.Stop()
          		}
          	}()
          	confirmed, confirmErr := engine.ConfirmTransaction(tx.ID)
          	if confirmErr == nil {
          		t.Fatal("helper confirmation failure was accepted")
          	}
          	if confirmed.CurrentState != StateRecoveryRequired {
          		t.Fatalf("confirmation failure state=%s", confirmed.CurrentState)
          	}
          	if engine.GetPendingTransaction() == nil {
          		t.Fatal("confirmation recovery context was discarded")
          	}
          }
          EOF
      - name: Format and run focused tests
        run: |
          gofmt -w cmd/router-applyd/main.go cmd/router-applyd/outcome.go cmd/router-applyd/persistence_outcome_test.go internal/apply/statemachine.go internal/apply/failure_scenarios_round2_test.go
          go test ./cmd/router-applyd ./internal/apply
      - name: Commit reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/router-applyd internal/apply
          git commit -m "fix: fail closed on corrupted recovery metadata"
          git push
