name: Apply signed offline repository fix

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply offline repository patch
        run: python3 .github/fix-offline-repo.py

      - name: Validate patched installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n packaging/alpine/build-iso.sh
          sh -n packaging/alpine/live-installer.sh
          grep -F 'build_offline_repos' packaging/alpine/build-iso.sh
          grep -F 'repo_main="$MEDIA/minimalrouter/repo/main"' packaging/alpine/live-installer.sh
          grep -F 'repo_community="$MEDIA/minimalrouter/repo/community"' packaging/alpine/live-installer.sh
          grep -F 'apk search --no-network -x' packaging/alpine/live-installer.sh
          git diff --check

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/build-iso.sh packaging/alpine/live-installer.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: provide signed offline Alpine repositories'
          git push origin HEAD:fix/live-install-offline-boot
