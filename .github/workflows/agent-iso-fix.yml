name: Apply ISO recovery fixes

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/agent-iso-fix.py

      - name: Validate patched tree
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/router-setup/main.go internal/services/nftables.go internal/services/nftables_ssh_recovery_test.go
          sh -n packaging/alpine/build-iso.sh
          sh -n packaging/alpine/live-installer.sh
          sh -n packaging/alpine/install-console.sh
          sh -n packaging/alpine/install-dist.sh
          sh -n packaging/alpine/install.sh
          go test ./internal/services
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/agent-iso-fix.py .github/workflows/agent-iso-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make ISO self-contained with SSH recovery'
          git push origin HEAD:fix/live-install-offline-boot
