name: PR53 targeted hardening

on:
  push:
    branches:
      - agent/deep-lab-hardening

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deep-lab-hardening
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply targeted hardening fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("cmd/router-applyd/main.go")
          source = path.read_text()

          old = '''func wgHandshakeFresh(dump string, keepalive int) error {
          \tfor _, line := range strings.Split(dump, "\\n") {
          \t\tfields := strings.Fields(line)
          \t\tif len(fields) < 8 || fields[0] == "interface" {
          \t\t\tcontinue
          \t\t}
          \t\tts, parseErr := strconv.ParseInt(fields[4], 10, 64)
          \t\tif parseErr != nil || ts <= 0 {
          \t\t\treturn errors.New("WireGuard client tunnel has no completed handshake")
          \t\t}
          \t\tif keepalive > 0 {
          \t\t\tmaxAge := 3 * time.Minute
          \t\t\tif age := time.Duration(keepalive) * 3 * time.Second; age > maxAge {
          \t\t\t\tmaxAge = age
          \t\t\t}
          \t\t\tif lastSeen := time.Since(time.Unix(ts, 0)); lastSeen > maxAge {
          \t\t\t\treturn fmt.Errorf("WireGuard client handshake is stale (last %s ago)", lastSeen.Round(time.Second))
          \t\t\t}
          \t\t}
          \t\treturn nil
          \t}
          \treturn errors.New("WireGuard client tunnel has no peer")
          }
          '''
          new = '''func wgHandshakeFresh(dump string, keepalive int) error {
          \tfor _, line := range strings.Split(dump, "\\n") {
          \t\tfields := strings.Fields(line)
          \t\tif len(fields) < 8 || fields[0] == "interface" {
          \t\t\tcontinue
          \t\t}
          \t\tts, parseErr := strconv.ParseInt(fields[4], 10, 64)
          \t\tif parseErr != nil || ts <= 0 {
          \t\t\treturn errors.New("WireGuard client tunnel has no completed handshake")
          \t\t}
          \t\tlastSeen := time.Since(time.Unix(ts, 0))
          \t\tif lastSeen < -30*time.Second {
          \t\t\treturn errors.New("WireGuard client handshake timestamp is in the future")
          \t\t}
          \t\tif keepalive > 0 {
          \t\t\tmaxAge := 3 * time.Minute
          \t\t\tif age := time.Duration(keepalive) * 3 * time.Second; age > maxAge {
          \t\t\t\tmaxAge = age
          \t\t\t}
          \t\t\tif lastSeen > maxAge {
          \t\t\t\treturn fmt.Errorf("WireGuard client handshake is stale (last %s ago)", lastSeen.Round(time.Second))
          \t\t\t}
          \t\t}
          \t\treturn nil
          \t}
          \treturn errors.New("WireGuard client tunnel has no peer")
          }
          '''
          if source.count(old) != 1:
              raise SystemExit("wgHandshakeFresh patch anchor mismatch")
          source = source.replace(old, new)

          old = '''\tif cfg.WireGuard.Enabled && plan.WireGuard {
          \t\tinterfaceName := cfg.WireGuard.Interface
          \t\tif interfaceName == "" {
          \t\t\tinterfaceName = "wg0"
          \t\t}
          \t\tif err := runFixed("/usr/bin/wg", "show", interfaceName); err != nil {
          \t\t\treturn fmt.Errorf("WireGuard interface unhealthy: %w", err)
          \t\t}
          \t\tif err := runFixed("/sbin/ip", "-4", "addr", "show", "dev", interfaceName); err != nil {
          \t\t\treturn fmt.Errorf("WireGuard address unavailable: %w", err)
          \t\t}
          \t}
          '''
          new = '''\tif cfg.WireGuard.Enabled && plan.WireGuard {
          \t\tinterfaceName := wireGuardInterfaceName(cfg.WireGuard)
          \t\tif err := runFixed("/usr/bin/wg", "show", interfaceName); err != nil {
          \t\t\treturn fmt.Errorf("WireGuard interface unhealthy: %w", err)
          \t\t}
          \t\taddressOutput, err := runFixedOutput("/sbin/ip", "-4", "addr", "show", "dev", interfaceName)
          \t\tif err != nil {
          \t\t\treturn fmt.Errorf("WireGuard address unavailable: %w", err)
          \t\t}
          \t\texpectedAddress := cfg.WireGuard.Address
          \t\tif slash := strings.IndexByte(expectedAddress, '/'); slash >= 0 {
          \t\t\texpectedAddress = expectedAddress[:slash]
          \t\t}
          \t\tif expectedAddress == "" || !strings.Contains(addressOutput, "inet "+expectedAddress+"/") {
          \t\t\treturn errors.New("configured WireGuard address is not active")
          \t\t}
          \t}
          \tif cfg.WGClient.Enabled && plan.WGClient {
          \t\tinterfaceName := wireGuardClientInterfaceName(cfg.WGClient)
          \t\tif err := runFixed("/usr/bin/wg", "show", interfaceName); err != nil {
          \t\t\treturn fmt.Errorf("WireGuard client interface unhealthy: %w", err)
          \t\t}
          \t\tif cfg.WGClient.Address != "" {
          \t\t\taddressOutput, err := runFixedOutput("/sbin/ip", "-4", "addr", "show", "dev", interfaceName)
          \t\t\tif err != nil {
          \t\t\t\treturn fmt.Errorf("WireGuard client address unavailable: %w", err)
          \t\t\t}
          \t\t\texpectedAddress := cfg.WGClient.Address
          \t\t\tif slash := strings.IndexByte(expectedAddress, '/'); slash >= 0 {
          \t\t\t\texpectedAddress = expectedAddress[:slash]
          \t\t\t}
          \t\t\tif !strings.Contains(addressOutput, "inet "+expectedAddress+"/") {
          \t\t\t\treturn errors.New("configured WireGuard client address is not active")
          \t\t\t}
          \t\t}
          \t}
          '''
          if source.count(old) != 1:
              raise SystemExit("verifyActive WireGuard patch anchor mismatch")
          source = source.replace(old, new)

          old = '''func rollback(previousConfig *config.SystemConfig, candidateConfig *config.SystemConfig, files []previousFile) error {
          \tvar errs []string
          '''
          new = '''func rollbackWireGuardCleanupInterfaces(previousConfig, candidateConfig *config.SystemConfig) []string {
          \tif candidateConfig == nil {
          \t\treturn nil
          \t}
          \tkeep := make(map[string]struct{}, 2)
          \tif previousConfig != nil {
          \t\tif previousConfig.WireGuard.Enabled {
          \t\t\tkeep[wireGuardInterfaceName(previousConfig.WireGuard)] = struct{}{}
          \t\t}
          \t\tif previousConfig.WGClient.Enabled {
          \t\t\tkeep[wireGuardClientInterfaceName(previousConfig.WGClient)] = struct{}{}
          \t\t}
          \t}
          \tcandidates := make([]string, 0, 2)
          \tif candidateConfig.WireGuard.Enabled {
          \t\tcandidates = append(candidates, wireGuardInterfaceName(candidateConfig.WireGuard))
          \t}
          \tif candidateConfig.WGClient.Enabled {
          \t\tcandidates = append(candidates, wireGuardClientInterfaceName(candidateConfig.WGClient))
          \t}
          \tstale := make([]string, 0, len(candidates))
          \tseen := make(map[string]struct{}, len(candidates))
          \tfor _, interfaceName := range candidates {
          \t\tif _, survives := keep[interfaceName]; survives {
          \t\t\tcontinue
          \t\t}
          \t\tif _, duplicate := seen[interfaceName]; duplicate {
          \t\t\tcontinue
          \t\t}
          \t\tseen[interfaceName] = struct{}{}
          \t\tstale = append(stale, interfaceName)
          \t}
          \treturn stale
          }

          func rollback(previousConfig *config.SystemConfig, candidateConfig *config.SystemConfig, files []previousFile) error {
          \tvar errs []string
          '''
          if source.count(old) != 1:
              raise SystemExit("rollback helper patch anchor mismatch")
          source = source.replace(old, new)

          old = '''\tif hadPreviousNft {
          '''
          new = '''\tfor _, interfaceName := range rollbackWireGuardCleanupInterfaces(previousConfig, candidateConfig) {
          \t\tif err := removeWireGuard(interfaceName); err != nil {
          \t\t\terrs = append(errs, "remove failed candidate WireGuard interface "+interfaceName+": "+safeError(err))
          \t\t}
          \t}
          \tif hadPreviousNft {
          '''
          if source.count(old) != 1:
              raise SystemExit("rollback cleanup insertion anchor mismatch")
          source = source.replace(old, new)

          path.write_text(source)

          Path("cmd/router-applyd/deep_audit_regression_test.go").write_text(r'''package main

import (
	"fmt"
	"reflect"
	"strings"
	"testing"
	"time"

	"github.com/vladimirperovic/minimalrouter/internal/config"
)

func TestRollbackWireGuardCleanupInterfacesRemovesCandidateOnlyNames(t *testing.T) {
	previous := config.DefaultConfig()
	previous.WireGuard.Enabled = true
	previous.WireGuard.Interface = "wg0"
	previous.WGClient.Enabled = true
	previous.WGClient.Interface = "wg1"

	candidate := previous.DeepCopy()
	candidate.WireGuard.Interface = "wg9"
	candidate.WGClient.Interface = "wg8"

	got := rollbackWireGuardCleanupInterfaces(&previous, &candidate)
	want := []string{"wg9", "wg8"}
	if !reflect.DeepEqual(got, want) {
		t.Fatalf("cleanup interfaces = %v, want %v", got, want)
	}
}

func TestRollbackWireGuardCleanupInterfacesCoversFirstRun(t *testing.T) {
	candidate := config.DefaultConfig()
	candidate.WireGuard.Enabled = true
	candidate.WireGuard.Interface = "wg7"
	candidate.WGClient.Enabled = true
	candidate.WGClient.Interface = "wg6"

	got := rollbackWireGuardCleanupInterfaces(nil, &candidate)
	want := []string{"wg7", "wg6"}
	if !reflect.DeepEqual(got, want) {
		t.Fatalf("first-run cleanup interfaces = %v, want %v", got, want)
	}
}

func TestRollbackWireGuardCleanupInterfacesPreservesSurvivingNames(t *testing.T) {
	previous := config.DefaultConfig()
	previous.WireGuard.Enabled = true
	previous.WireGuard.Interface = "wg0"
	previous.WGClient.Enabled = true
	previous.WGClient.Interface = "wg1"
	candidate := previous.DeepCopy()

	if got := rollbackWireGuardCleanupInterfaces(&previous, &candidate); len(got) != 0 {
		t.Fatalf("surviving interfaces were marked stale: %v", got)
	}
}

func TestVerificationPlanTracksWireGuardClientChanges(t *testing.T) {
	previous := config.DefaultConfig()
	previous.WGClient.Enabled = true
	previous.WGClient.Address = "10.20.30.2/32"
	candidate := previous.DeepCopy()

	if verificationPlan("apply_all", &previous, candidate).WGClient {
		t.Fatal("unchanged WireGuard client unexpectedly requires verification")
	}
	candidate.WGClient.Address = "10.20.30.3/32"
	if !verificationPlan("apply_all", &previous, candidate).WGClient {
		t.Fatal("WireGuard client address change must require verification")
	}
}

func wgDumpForHandshake(timestamp int64) string {
	return fmt.Sprintf("private public 51820 off\npeer psk 198.51.100.1:51820 10.0.0.0/24 %d 10 20 25\n", timestamp)
}

func TestWGHandshakeFreshRejectsFutureTimestamp(t *testing.T) {
	err := wgHandshakeFresh(wgDumpForHandshake(time.Now().Add(10*time.Minute).Unix()), 25)
	if err == nil || !strings.Contains(err.Error(), "future") {
		t.Fatalf("future handshake timestamp was accepted: %v", err)
	}
}

func TestWGHandshakeFreshAcceptsRecentTimestamp(t *testing.T) {
	if err := wgHandshakeFresh(wgDumpForHandshake(time.Now().Add(-10*time.Second).Unix()), 25); err != nil {
		t.Fatalf("recent handshake timestamp was rejected: %v", err)
	}
}
''')
          PY
          gofmt -w cmd/router-applyd/main.go cmd/router-applyd/deep_audit_regression_test.go
          go test -race ./cmd/router-applyd
          go vet ./cmd/router-applyd
      - name: Commit tested fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr53-targeted-hardening.yml
          git config user.name "PR53 Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add cmd/router-applyd/main.go cmd/router-applyd/deep_audit_regression_test.go .github/workflows/pr53-targeted-hardening.yml
          git commit -m "fix: harden WireGuard rollback and verification"
          git push origin HEAD:agent/deep-lab-hardening
