name: Apply offline APK bundle fix

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/fix-offline-apk-bundle.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          sh -n packaging/alpine/build-iso.sh
          grep -F 'ca-certificates openssl openssh-server' packaging/alpine/build-iso.sh
          grep -F 'alpine-base e2fsprogs linux-firmware-none linux-lts openssl syslinux' packaging/alpine/build-iso.sh
          git diff --check

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/build-iso.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close offline APK dependency set'
          git push origin HEAD:fix/live-install-offline-boot
