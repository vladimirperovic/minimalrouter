name: Apply clean live apk world fix

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/world-fix.py
          sh -n packaging/alpine/live-installer.sh
          grep -F 'world_backup=/tmp/minimalrouter-apk-world.before' packaging/alpine/live-installer.sh
          grep -F 'cp "$world_backup" /etc/apk/world' packaging/alpine/live-installer.sh
          git diff --check

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/live-installer.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep live APK bundle out of target world'
          git push origin HEAD:fix/live-install-offline-boot
