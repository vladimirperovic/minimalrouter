name: Temporary gateway workspace export

on:
  push:
    branches:
      - agent/gateway-quality-monitoring
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/gateway-quality-monitoring' || github.ref_name == 'agent/gateway-quality-monitoring'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Package complete workspace
        run: tar --exclude='./gateway-workspace.tar.gz' -czf gateway-workspace.tar.gz .
      - name: Upload workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-workspace-${{ github.sha }}
          path: gateway-workspace.tar.gz
          retention-days: 1
