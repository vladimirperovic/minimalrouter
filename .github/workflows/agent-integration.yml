name: Agent integration patch

on:
  push:
    branches:
      - agent/recovery-parental-release-hardening

permissions:
  contents: write

concurrency:
  group: agent-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/recovery-parental-release-hardening
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Integrate feature modules
        run: python3 scripts/integrate-agent-branch.py

      - name: Refresh lockfile and format
        run: |
          pnpm --dir web install --lockfile-only
          gofmt -w cmd internal

      - name: Validate integrated tree
        run: |
          go test ./...
          go vet ./...
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web lint
          pnpm --dir web test
          pnpm --dir web build

      - name: Remove one-shot integration helpers
        run: |
          rm -f scripts/integrate-agent-branch.py
          rm -f .github/workflows/agent-integration.yml

      - name: Commit integrated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Minimal Router Integration Bot"
          git config user.email "integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate recovery and device profiles"
          git push origin HEAD:agent/recovery-parental-release-hardening
