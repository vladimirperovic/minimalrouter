name: Patch memory idempotency fallback

on:
  push:
    branches:
      - agent/failure-hardening-round2
    paths:
      - .github/workflows/patch-memory-idempotency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/failure-hardening-round2
      - name: Apply in-memory idempotency fallback
        shell: python
        run: |
          from pathlib import Path

          outcome = Path("cmd/router-applyd/outcome.go")
          text = outcome.read_text()
          marker = "func replayTransactionResponse"
          addition = '''func persistTransactionOutcome(record transactionRecord, save func(transactionRecord) error) (transactionRecord, apply.ApplyResponse) {
          \tresponse := record.Response
          \tif err := save(record); err != nil {
          \t\tresponse = journalPersistenceFailure(record.ID, response)
          \t\trecord.Response = response
          \t}
          \treturn record, response
          }

          '''
          if text.count(marker) != 1 or "func persistTransactionOutcome" in text:
              raise SystemExit("outcome insertion marker was not unique")
          outcome.write_text(text.replace(marker, addition + marker, 1))

          main = Path("cmd/router-applyd/main.go")
          text = main.read_text()
          replacements = [
              ('''var applyMu sync.Mutex
          var transactionIDPattern''', '''var applyMu sync.Mutex
          var lastTransactionMemory *transactionRecord
          var transactionIDPattern'''),
              ('''\tprevious, loadErr := loadLastTransaction()
          \tif replay, handled := replayTransactionResponse(req.ID, configHash, previous, loadErr); handled {
          \t\twriteResponse(conn, *replay)
          \t\treturn
          \t}''', '''\tif lastTransactionMemory != nil {
          \t\tif replay, handled := replayTransactionResponse(req.ID, configHash, lastTransactionMemory, nil); handled {
          \t\t\twriteResponse(conn, *replay)
          \t\t\treturn
          \t\t}
          \t}
          \tprevious, loadErr := loadLastTransaction()
          \tif replay, handled := replayTransactionResponse(req.ID, configHash, previous, loadErr); handled {
          \t\twriteResponse(conn, *replay)
          \t\treturn
          \t}'''),
              ('''\tif err := saveLastTransaction(transactionRecord{
          \t\tID: req.ID, ConfigHash: configHash, Response: resp, CompletedAt: time.Now(),
          \t}); err != nil {
          \t\tresp = journalPersistenceFailure(req.ID, resp)
          \t}
          \twriteResponse(conn, resp)''', '''\trecord := transactionRecord{
          \t\tID: req.ID, ConfigHash: configHash, Response: resp, CompletedAt: time.Now(),
          \t}
          \trecord, resp = persistTransactionOutcome(record, saveLastTransaction)
          \tlastTransactionMemory = &record
          \twriteResponse(conn, resp)'''),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"memory idempotency block was not unique: {old[:100]!r}")
              text = text.replace(old, new, 1)
          main.write_text(text)
      - name: Add memory fallback tests
        shell: bash
        run: |
          cat >> cmd/router-applyd/outcome_test.go <<'EOF'

          func TestPersistTransactionOutcomeCachesRecoveryWhenDiskJournalFails(t *testing.T) {
          	record := validTransactionRecordForTest()
          	stored, response := persistTransactionOutcome(record, func(transactionRecord) error {
          		return errors.New("disk full")
          	})
          	if !response.RecoveryRequired || response.RolledBack || response.Success {
          		t.Fatalf("journal failure response=%+v", response)
          	}
          	if !stored.Response.RecoveryRequired {
          		t.Fatal("in-memory record did not retain recovery-required result")
          	}
          	replayed, handled := replayTransactionResponse(stored.ID, stored.ConfigHash, &stored, nil)
          	if !handled || replayed == nil || !replayed.RecoveryRequired {
          		t.Fatalf("in-memory recovery result was not replayed: handled=%v response=%+v", handled, replayed)
          	}
          }
          EOF
      - name: Ensure outcome test imports errors
        shell: python
        run: |
          from pathlib import Path
          path = Path("cmd/router-applyd/outcome_test.go")
          text = path.read_text()
          old = '''import (
          \t"testing"'''
          new = '''import (
          \t"errors"
          \t"testing"'''
          if text.count(old) != 1:
              raise SystemExit("outcome test import block was not unique")
          path.write_text(text.replace(old, new, 1))
      - name: Format and run focused tests
        run: |
          gofmt -w cmd/router-applyd/main.go cmd/router-applyd/outcome.go cmd/router-applyd/outcome_test.go
          go test ./cmd/router-applyd ./internal/apply
      - name: Commit reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/router-applyd
          git commit -m "fix: retain idempotent outcome when journal writes fail"
          git push
