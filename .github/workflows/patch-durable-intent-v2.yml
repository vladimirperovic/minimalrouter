name: Apply durable intent patch v2

on:
  push:
    branches:
      - agent/failure-hardening-round2
    paths:
      - .github/workflows/patch-durable-intent-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/failure-hardening-round2
      - name: Apply idempotent patch
        run: python3 scripts/ci-patch-durable-intent-v2.py
      - name: Format and test
        run: |
          gofmt -w cmd/router-applyd/main.go cmd/router-applyd/outcome.go cmd/router-applyd/persistence_validation_test.go cmd/router-applyd/persistence_outcome_test.go
          go test ./cmd/router-applyd ./internal/apply
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/router-applyd
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: journal privileged intent before side effects"
          git push
