name: Lab

# A router lab on one GitHub runner: the production ISO is installed into a QEMU
# VM, a PPPoE "provider" and a LAN client run in network namespaces, and
# scripts/gh-lab/suite.sh then tries to break it (firewall, API, daemon crashes,
# PPPoE loss, reboots, power cut, memory and CPU under load, a soak).
#
# It takes the ISO that the Appliance ISO workflow already built and tested, so
# it runs after that workflow has passed once on the branch. Pushes that touch
# only scripts/gh-lab re-run it without rebuilding the ISO.

on:
  pull_request:
    paths:
      - "scripts/gh-lab/**"
      - ".github/workflows/lab.yml"
  workflow_dispatch:
    inputs:
      iso_run_id:
        description: "Appliance ISO run to take the ISO from (default: latest successful run on this branch)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: Install, connect and attack the router
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils xorriso expect socat sshpass \
            pppoe ppp "linux-modules-extra-$(uname -r)" \
            nftables iproute2 dnsutils isc-dhcp-client iperf3 nmap jq curl netcat-openbsd python3

      - name: Allow KVM when the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo "KVM available"
          else
            echo "No /dev/kvm: the router VM runs under slow software emulation"
          fi

      - name: Find and download the tested ISO
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_RUN_ID: ${{ inputs.iso_run_id }}
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          run_id="$ISO_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow iso.yml --branch "$branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id" && [ "$run_id" != null ] || { echo "No successful Appliance ISO run on $branch yet; run that workflow first." >&2; exit 1; }
          echo "Using the ISO from Appliance ISO run $run_id"
          gh run download "$run_id" --pattern 'minimalrouter-appliance-iso-*' --dir iso
          find iso -name '*.iso' | tee iso-path.txt
          test "$(wc -l < iso-path.txt)" -eq 1

      - name: Run the lab
        run: bash scripts/gh-lab/run.sh "$(cat iso-path.txt)"

      - name: Upload logs, results and measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-${{ github.sha }}
          path: /tmp/minimalrouter-lab/logs
          if-no-files-found: warn
          retention-days: 14
