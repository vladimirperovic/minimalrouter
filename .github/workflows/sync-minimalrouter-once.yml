name: Sync Minimal Router code once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-minimalrouter-once.yml

permissions:
  contents: write

concurrency:
  group: sync-minimalrouter-home
  cancel-in-progress: false

jobs:
  sync:
    name: Copy verified source and commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out private home repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Check out green public source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch agent/recovery-parental-release-hardening \
            https://github.com/vladimirperovic/minimalrouter.git "$RUNNER_TEMP/minimalrouter-public"

      - name: Copy approved program and documentation files
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/minimalrouter-public"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            install -D -m 0644 "$source/$path" "$path"
          done <<'FILES'
          CHANGELOG.md
          Makefile
          README.md
          api/openapi.yaml
          cmd/firmware-sign/main.go
          cmd/router-applyd/hardening_linux.go
          cmd/router-applyd/hardening_other.go
          cmd/router-applyd/main.go
          cmd/router-recovery/main.go
          cmd/router-update/main.go
          cmd/routerd/main.go
          docs/DEVICE_PROFILES.md
          docs/README.md
          docs/RECOVERY.md
          docs/RELEASE_SECURITY.md
          docs/TESTING.md
          internal/api/interfaces.go
          internal/api/server.go
          internal/config/device_profiles_validation.go
          internal/config/model.go
          internal/config/validation.go
          internal/firmware/signing.go
          internal/firmware/slots.go
          internal/firmware/slots_test.go
          internal/network/interfaces.go
          internal/network/interfaces_test.go
          internal/recovery/recovery.go
          internal/recovery/recovery_test.go
          internal/services/device_profiles.go
          internal/services/device_profiles_test.go
          internal/services/dnsmasq.go
          internal/services/nftables.go
          packaging/alpine/install-dist.sh
          web/e2e/dashboard.spec.ts
          web/package.json
          web/playwright.config.ts
          web/pnpm-lock.yaml
          web/src/DashboardApp.css
          web/src/DashboardApp.tsx
          web/src/components/AuditLogPanel.tsx
          web/src/components/DNSFilterPanel.css
          web/src/components/DNSFilterPanel.tsx
          web/src/components/SetupWizard.css
          web/src/components/SetupWizard.tsx
          web/src/lib/deviceProfiles.test.ts
          web/src/lib/deviceProfiles.ts
          web/src/main.tsx
          web/tsconfig.json
          web/vitest.config.ts
          FILES
          chmod 0755 packaging/alpine/install-dist.sh
          rm -f web/src/App.tsx web/src/components/DashboardLogs.tsx

      - name: Commit synchronized files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository is already synchronized."
            exit 0
          fi
          git commit -m "sync: recovery, Kids scheduler, and release hardening"
          git pull --rebase origin main
          git push origin HEAD:main
