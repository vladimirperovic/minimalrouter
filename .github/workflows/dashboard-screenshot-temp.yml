name: Dashboard screenshot temporary

on:
  push:
    branches:
      - docs/dashboard-preview

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/dashboard-preview
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build dashboard
        working-directory: web
        run: pnpm build
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture real browser screenshot
        working-directory: web
        run: pnpm exec playwright test e2e/dashboard-screenshot.spec.ts --project=chromium
      - name: Commit rendered PNG
        run: |
          set -eu
          git add docs/images/dashboard-overview.png
          if git diff --cached --quiet; then
            echo "Screenshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh browser-rendered dashboard screenshot"
          git push origin HEAD:docs/dashboard-preview
