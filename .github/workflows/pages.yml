name: GitHub Pages dashboard demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Prepare demo release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test -n "$version"
          VERSION="$version" node <<'NODE'
          const fs = require("fs");
          const path = "web/src/lib/demoApi.ts";
          let source = fs.readFileSync(path, "utf8");
          const demoVersion = `v${process.env.VERSION}-demo`;
          source = source.replace(/version: "v[0-9]+\.[0-9]+\.[0-9]+-demo"/, `version: "${demoVersion}"`);
          source = source.replace(
            'headline: "2 of 12 checks need attention."',
            'headline: "1 of 12 checks needs attention."',
          );
          source = source.replace(
            '{ id: "updates", label: "Updates", state: "warning", summary: "Firmware verification trust anchor is not configured" },',
            '{ id: "updates", label: "Updates", state: "healthy", summary: "Firmware verification trust anchor is configured" },',
          );
          if (!source.includes(`version: "${demoVersion}"`)) {
            throw new Error(`demo version injection failed for ${demoVersion}`);
          }
          if (!source.includes('label: "Updates", state: "healthy", summary: "Firmware verification trust anchor is configured"')) {
            throw new Error("demo release trust state injection failed");
          }
          fs.writeFileSync(path, source);
          NODE
      - run: pnpm --dir web build
        env:
          VITE_DEMO_MODE: "true"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
