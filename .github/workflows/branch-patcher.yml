name: One-shot branch polling patch

on:
  push:
    branches:
      - agent/ux-release-014-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-release-014-cleanup
      - name: Apply polling cleanup and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          overview = Path('web/src/components/ClassicOverviewBase.tsx')
          text = overview.read_text()
          old = '''  useEffect(() => {
    let active = true;
    const sample = () => {
      void apiFetch("/api/v1/system")
        .then((response) => response.ok ? response.json() : Promise.reject(new Error("System status unavailable")))
        .then((data: SystemStatus) => {
          if (!active || !data.runtime) return;
          const now = Date.now();
          const rx = data.runtime.rx_bytes || 0;
          const tx = data.runtime.tx_bytes || 0;
          if (lastBytesRef.current) {
            const elapsed = Math.max(0.1, (now - lastBytesRef.current.time) / 1000);
            const rxRate = Math.max(0, (rx - lastBytesRef.current.rx) * 8 / (1024 * 1024 * elapsed));
            const txRate = Math.max(0, (tx - lastBytesRef.current.tx) * 8 / (1024 * 1024 * elapsed));
            setBandwidthHistory((previous) => [...previous, { rx: rxRate, tx: txRate }].slice(-30));
          }
          lastBytesRef.current = { rx, tx, time: now };
        })
        .catch(() => undefined);
    };
    sample();
    const interval = window.setInterval(sample, 2000);
    return () => {
      active = false;
      window.clearInterval(interval);
    };
  }, []);
'''
          new = '''  useEffect(() => {
    let active = true;
    let timer = 0;
    const controller = new AbortController();

    const sample = async () => {
      if (!active || document.visibilityState !== "visible") return;
      try {
        const response = await apiFetch("/api/v1/system", { signal: controller.signal });
        if (!response.ok) throw new Error("System status unavailable");
        const data = (await response.json()) as SystemStatus;
        if (!active || !data.runtime) return;
        const now = Date.now();
        const rx = data.runtime.rx_bytes || 0;
        const tx = data.runtime.tx_bytes || 0;
        if (lastBytesRef.current) {
          const elapsed = Math.max(0.1, (now - lastBytesRef.current.time) / 1000);
          const rxRate = Math.max(0, (rx - lastBytesRef.current.rx) * 8 / (1024 * 1024 * elapsed));
          const txRate = Math.max(0, (tx - lastBytesRef.current.tx) * 8 / (1024 * 1024 * elapsed));
          setBandwidthHistory((previous) => [...previous, { rx: rxRate, tx: txRate }].slice(-30));
        }
        lastBytesRef.current = { rx, tx, time: now };
      } catch (error) {
        if ((error as Error).name !== "AbortError") {
          // A missed chart sample is non-fatal; the next visible poll repairs it.
        }
      }
      if (active && document.visibilityState === "visible") {
        timer = window.setTimeout(() => void sample(), 5000);
      }
    };

    const onVisibilityChange = () => {
      window.clearTimeout(timer);
      if (document.visibilityState === "visible") void sample();
    };
    void sample();
    document.addEventListener("visibilitychange", onVisibilityChange);
    return () => {
      active = false;
      controller.abort();
      window.clearTimeout(timer);
      document.removeEventListener("visibilitychange", onVisibilityChange);
    };
  }, []);
'''
          if old not in text:
              raise SystemExit('ClassicOverview polling block did not match expected source')
          overview.write_text(text.replace(old, new, 1))

          app = Path('web/src/DashboardApp.tsx')
          text = app.read_text()
          old = '''  useEffect(() => {
    let active = true;
    let timer = 0;
    const poll = async () => {
      await load();
      if (active) timer = window.setTimeout(poll, 15000);
    };
    void poll();
    return () => {
      active = false;
      window.clearTimeout(timer);
      pollController.current?.abort();
    };
  }, [load]);
'''
          new = '''  useEffect(() => {
    let active = true;
    let timer = 0;
    const poll = async () => {
      if (!active || document.visibilityState !== "visible") return;
      await load();
      if (active && document.visibilityState === "visible") {
        timer = window.setTimeout(() => void poll(), 30000);
      }
    };
    const onVisibilityChange = () => {
      window.clearTimeout(timer);
      if (document.visibilityState === "visible") void poll();
    };
    void poll();
    document.addEventListener("visibilitychange", onVisibilityChange);
    return () => {
      active = false;
      window.clearTimeout(timer);
      document.removeEventListener("visibilitychange", onVisibilityChange);
      pollController.current?.abort();
    };
  }, [load]);
'''
          if old not in text:
              raise SystemExit('Dashboard polling block did not match expected source')
          app.write_text(text.replace(old, new, 1))

          Path('.github/workflows/branch-patcher.yml').unlink()
      - name: Commit one-shot patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/ClassicOverviewBase.tsx web/src/DashboardApp.tsx .github/workflows/branch-patcher.yml
          git commit -m "Reduce dashboard polling and pause hidden tabs"
          git push origin HEAD:agent/ux-release-014-cleanup
