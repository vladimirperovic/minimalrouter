name: Apply rootfs image installer patch

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/rootfs-image-patch.py
      - name: Validate
        run: |
          set -euo pipefail
          sh -n packaging/alpine/build-rootfs.sh
          sh -n packaging/alpine/build-iso.sh
          sh -n packaging/alpine/live-installer.sh
          sh -n packaging/alpine/install-dist.sh
          grep -F 'install_appliance_rootfs' packaging/alpine/live-installer.sh
          grep -F 'build-rootfs.sh' packaging/alpine/build-iso.sh
          grep -F 'MINIMALROUTER_IMAGE_BUILD' packaging/alpine/install-dist.sh
          git diff --check
      - name: Commit production changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/build-rootfs.sh packaging/alpine/build-iso.sh packaging/alpine/live-installer.sh packaging/alpine/install-dist.sh
          git diff --cached --quiet && exit 0
          git commit -m 'feat: install prebuilt appliance rootfs from ISO'
          git push origin HEAD:fix/live-install-offline-boot
