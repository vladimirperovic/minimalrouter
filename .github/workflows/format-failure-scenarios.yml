name: Format failure scenario files

on:
  push:
    branches:
      - agent/failure-scenario-hardening
    paths:
      - internal/apply/statemachine.go
      - internal/apply/failure_scenarios_test.go
      - .github/workflows/format-failure-scenarios.yml

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/failure-scenario-hardening
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format only reviewed files
        run: gofmt -w internal/apply/statemachine.go internal/apply/failure_scenarios_test.go
      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- internal/apply/statemachine.go internal/apply/failure_scenarios_test.go; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/apply/statemachine.go internal/apply/failure_scenarios_test.go
          git commit -m "style: gofmt failure recovery scenarios"
          git push
