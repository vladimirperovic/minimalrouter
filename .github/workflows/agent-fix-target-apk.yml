name: Apply target APK chroot fix

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent-fix-target-apk.py
          sh -n packaging/alpine/live-installer.sh
          grep -F 'chroot /mnt /bin/sh -c' packaging/alpine/live-installer.sh
          grep -F 'set -- "$apk_dir"/*.apk' packaging/alpine/live-installer.sh
          git diff --check

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/live-installer.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: expand target APK bundle inside chroot'
          git push origin HEAD:fix/live-install-offline-boot
