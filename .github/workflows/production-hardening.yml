name: Apply lowercase installer branding

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply branding
        run: python3 .github/lowercase-branding.py

      - name: Validate branding
        shell: bash
        run: |
          set -euo pipefail
          sh -n packaging/alpine/install-console.sh
          sh -n packaging/alpine/live-installer.sh
          grep -F '|                      minimalrouter                       |' packaging/alpine/install-console.sh
          grep -F '|                      minimalrouter                       |' packaging/alpine/live-installer.sh
          git diff --check

      - name: Commit branding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/install-console.sh packaging/alpine/live-installer.sh
          git diff --cached --quiet && exit 0
          git commit -m 'style: standardize lowercase minimalrouter installer branding'
          git push origin HEAD:fix/live-install-offline-boot
