name: Apply installer production hardening

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply production hardening
        run: python3 .github/production-hardening.py

      - name: Validate production changes
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/router-setup/main.go
          go test ./cmd/router-setup ./internal/network ./internal/services
          sh -n packaging/alpine/install-console.sh
          sh -n packaging/alpine/live-installer.sh
          grep -F 'guard_existing_install' packaging/alpine/live-installer.sh
          grep -F 'validate_target_disk' packaging/alpine/live-installer.sh
          grep -F 'minimalrouter' packaging/alpine/install-console.sh
          git diff --check

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions tokens cannot update workflow files. The iso.yml
          # assertions are applied separately after this production commit.
          git checkout -- .github/workflows/iso.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/install-console.sh packaging/alpine/live-installer.sh cmd/router-setup/main.go scripts/ci/iso-full-install.exp
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add repeat-install guard and installer preflight'
          git push origin HEAD:fix/live-install-offline-boot
