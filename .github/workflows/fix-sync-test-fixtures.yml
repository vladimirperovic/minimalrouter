name: Fix sync test fixtures

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-fixtures:
    if: github.head_ref == 'sync/minimalrouterhome-20260804'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sync/minimalrouterhome-20260804
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Replace high-entropy test-only WireGuard fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          zero_key = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          one_key = 'AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE='

          p = Path('internal/config/validation_test.go')
          s = p.read_text()
          s = re.sub(r'(func TestValidateWGClient\(t \*testing\.T\) \{\n\s*validKey := )"[^"]+"', rf'\1"{zero_key}"', s)
          block_start = s.index('func TestValidateWGClient')
          head, tail = s[:block_start], s[block_start:]
          tail = re.sub(r'(\bPublicKey:\s*)"[^"]+"', rf'\1"{one_key}"', tail, count=1)
          p.write_text(head + tail)

          p = Path('internal/services/generators_test.go')
          s = p.read_text()
          s = re.sub(r'(\bPrivateKey:\s*)"[^"]+"', rf'\1"{zero_key}"', s)
          s = re.sub(r'(\bPublicKey:\s*)"[^"]+"', rf'\1"{one_key}"', s)
          s = re.sub(r'"PrivateKey = [^"]+"', f'"PrivateKey = {zero_key}"', s)
          s = re.sub(r'"PublicKey = [^"]+"', f'"PublicKey = {one_key}"', s)
          p.write_text(s)
          PY
          gofmt -w internal/config/validation_test.go internal/services/generators_test.go
          go test ./internal/config ./internal/services
      - name: Commit fixture cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/config/validation_test.go internal/services/generators_test.go
          git diff --cached --quiet && exit 0
          git commit -m "test: use obvious non-secret WireGuard fixtures"
          git push origin HEAD:sync/minimalrouterhome-20260804
