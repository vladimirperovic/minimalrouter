name: Apply installer acceptance fixes

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply acceptance patch
        run: python3 .github/acceptance-fix2.py

      - name: Validate patched tree
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/router-setup/main.go cmd/router-setup/main_test.go
          sh -n packaging/alpine/build-iso.sh
          sh -n packaging/alpine/install-console.sh
          sh -n packaging/alpine/live-installer.sh
          expect -n scripts/ci/iso-full-install.exp
          go test ./cmd/router-setup ./internal/services
          git diff --check

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/build-iso.sh packaging/alpine/install-console.sh packaging/alpine/live-installer.sh cmd/router-setup/main.go cmd/router-setup/main_test.go scripts/ci/iso-full-install.exp
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden and simplify appliance installer UX'
          git push origin HEAD:fix/live-install-offline-boot
