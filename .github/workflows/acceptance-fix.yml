name: Apply installer acceptance fixes

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Tighten virtual disk detection
        run: python3 .github/tighten-vm-disk.py

      - name: Validate patched tree
        shell: bash
        run: |
          set -euo pipefail
          sh -n packaging/alpine/live-installer.sh
          grep -F 'raw physical disk passed through to QEMU' packaging/alpine/live-installer.sh
          git diff --check

      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/alpine/live-installer.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: auto-install only to clearly virtual VM disks'
          git push origin HEAD:fix/live-install-offline-boot
