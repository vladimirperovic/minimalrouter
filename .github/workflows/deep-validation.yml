name: Deep validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: deep-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crash-fuzz-benchmark:
    name: Crash recovery, fuzzing and benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stress interrupted update recovery
        run: |
          go test -race -count=25 ./internal/firmware \
            -run 'Test(Interrupted|CorruptOperationJournal|OperationJournal|SlotManagerStages)'
      - name: Fuzz malformed unauthenticated API requests
        run: go test ./internal/api -run '^$' -fuzz '^FuzzMalformedUnauthenticatedRequests$' -fuzztime=20s
      - name: Fuzz update operation journals
        run: go test ./internal/firmware -run '^$' -fuzz '^FuzzOperationJournalParsing$' -fuzztime=20s
      - name: Run slot state benchmarks
        run: |
          mkdir -p build/deep-test
          go test ./internal/firmware -run '^$' -bench '^BenchmarkSlotManager' -benchmem -benchtime=2s -count=5 | tee build/deep-test/slot-benchmarks.txt
      - name: Measure test coverage
        run: |
          go test ./... -covermode=atomic -coverprofile=build/deep-test/coverage.out
          go tool cover -func=build/deep-test/coverage.out | tee build/deep-test/coverage.txt
      - name: Upload fuzz and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-fuzz-benchmark-${{ github.sha }}
          path: build/deep-test
          if-no-files-found: warn
          retention-days: 14

  network-laboratory:
    name: WAN, router and LAN namespace laboratory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install network test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox dnsmasq-base dnsutils iperf3 iproute2 iputils-ping jq netcat-openbsd nftables nmap
      - name: Validate network laboratory syntax
        run: bash -n scripts/ci-network-namespace-lab.sh
      - name: Run isolated router network laboratory
        run: |
          sudo bash scripts/ci-network-namespace-lab.sh build/deep-test/network
          sudo chown -R "$USER":"$USER" build/deep-test/network
          chmod -R a+rX build/deep-test/network
      - name: Upload network measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-laboratory-${{ github.sha }}
          path: build/deep-test/network
          if-no-files-found: warn
          retention-days: 14

  security-hardening:
    name: Security hardening and binary inspection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install host security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
      - name: Validate shell scripts
        run: |
          shellcheck -S error scripts/*.sh packaging/alpine/*.sh
          bash -n scripts/ci-network-namespace-lab.sh
      - name: Validate GitHub Actions workflows
        run: actionlint
      - name: Run high-confidence Go security analysis
        run: |
          mkdir -p build/deep-test/security
          gosec -severity high -confidence high -fmt=json -out=build/deep-test/security/gosec.json ./...
      - name: Build and inspect Linux binaries
        run: |
          make build-linux-amd64
          mkdir -p build/deep-test/security
          for binary in bin/*-linux-amd64; do
            file "$binary" | tee -a build/deep-test/security/binaries.txt
            go version -m "$binary" >>build/deep-test/security/binaries.txt
            readelf -W -l "$binary" >>build/deep-test/security/readelf.txt
            if readelf -W -l "$binary" | awk '/GNU_STACK/ && $0 ~ /RWE/ {found=1} END {exit found ? 0 : 1}'; then
              echo "Executable stack detected in $binary" >&2
              exit 1
            fi
          done
          go list -m -json all >build/deep-test/security/go-modules.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-hardening-${{ github.sha }}
          path: build/deep-test/security
          if-no-files-found: warn
          retention-days: 14

  arm64-emulation:
    name: ARM64 build and QEMU smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ARM64 emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file jq qemu-user-static
      - name: Build ARM64 binaries
        run: make build-linux-arm64
      - name: Execute recovery-safe ARM64 commands
        run: |
          file bin/*-linux-arm64
          qemu-aarch64-static bin/router-update-linux-arm64 --help | grep -q 'Usage: router-update'
          qemu-aarch64-static bin/router-recovery-linux-arm64 --help | grep -q 'Usage: router-recovery'
          root="$(mktemp -u)"
          MINIMALROUTER_UPDATE_ROOT="$root" qemu-aarch64-static bin/router-update-linux-arm64 status >status.json
          jq -e '.current == "" and .previous == "" and .pending == ""' status.json
          test ! -e "$root"
