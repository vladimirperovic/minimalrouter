name: Deep validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: deep-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crash-recovery:
    name: Interrupted update recovery, repeated
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Stress the update slot and operation journal tests
        working-directory: rust
        run: |
          # The Go suite ran these 25 times under the race detector. Rust has
          # no race detector; repetition still catches flaky ordering.
          cargo test --locked --no-run -p mr-core
          rounds=0
          while [ "$rounds" -lt 25 ]; do
            cargo test --locked -p mr-core firmware
            rounds=$((rounds + 1))
          done

  network-laboratory:
    name: WAN, router and LAN namespace laboratory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install network test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            busybox \
            dnsmasq-base \
            dnsutils \
            iperf3 \
            iproute2 \
            iputils-ping \
            jq \
            netcat-openbsd \
            nftables \
            nmap
      - name: Validate network laboratory syntax
        run: bash -n scripts/ci-network-namespace-lab.sh
      - name: Run isolated router network laboratory
        run: |
          sudo bash scripts/ci-network-namespace-lab.sh build/deep-test/network
          sudo chown -R "$USER":"$USER" build/deep-test/network
          chmod -R a+rX build/deep-test/network
      - name: Upload network measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-laboratory-${{ github.sha }}
          path: build/deep-test/network
          if-no-files-found: warn
          retention-days: 14

  security-hardening:
    name: Security hardening and binary inspection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install host security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file shellcheck
      - name: Validate shell scripts
        run: |
          shellcheck -S error scripts/*.sh packaging/alpine/*.sh
          bash -n scripts/ci-network-namespace-lab.sh
      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Build and inspect Linux binaries
        run: |
          make build-linux-amd64
          mkdir -p build/deep-test/security
          for binary in bin/*-linux-amd64; do
            file "$binary" | tee -a build/deep-test/security/binaries.txt
            readelf -W -l "$binary" >>build/deep-test/security/readelf.txt
            if readelf -W -l "$binary" | awk '/GNU_STACK/ && $0 ~ /RWE/ {found=1} END {exit found ? 0 : 1}'; then
              echo "Executable stack detected in $binary" >&2
              exit 1
            fi
            if readelf -W -l "$binary" | grep -q 'Requesting program interpreter'; then
              echo "$binary is not statically linked" >&2
              exit 1
            fi
          done
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 >build/deep-test/security/cargo-metadata.json
      - name: Keep unsafe code in one module
        run: |
          # Lines that only mention the word inside a string literal are not code.
          unexpected="$(grep -rnE 'unsafe[[:space:]]*(\{|fn |impl )' rust/crates rust/src --include='*.rs' | grep -v 'rust/crates/mr-core/src/sys.rs' | grep -vE '"[^"]*unsafe' || true)"
          if [ -n "$unexpected" ]; then
            echo "unsafe code outside sys.rs:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-hardening-${{ github.sha }}
          path: build/deep-test/security
          if-no-files-found: warn
          retention-days: 14

  arm64-emulation:
    name: ARM64 build and QEMU smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install ARM64 emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file jq qemu-user-static
      - name: Build ARM64 binaries
        run: make build-linux-arm64
      - name: Execute recovery-safe ARM64 commands
        run: |
          file bin/*-linux-arm64
          qemu-aarch64-static bin/router-update-linux-arm64 --help | grep -q 'Usage: router-update'
          qemu-aarch64-static bin/router-recovery-linux-arm64 --help | grep -q 'Usage: router-recovery'
          root="$(mktemp -u)"
          MINIMALROUTER_UPDATE_ROOT="$root" qemu-aarch64-static bin/router-update-linux-arm64 status >status.json
          jq -e '.current == "" and .previous == "" and .pending == ""' status.json
          test ! -e "$root"
