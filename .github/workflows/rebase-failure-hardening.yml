name: Rebase failure hardening

on:
  push:
    branches:
      - agent/failure-scenario-hardening-v3
    paths:
      - .github/workflows/rebase-failure-hardening.yml

permissions:
  contents: write

jobs:
  rebase-reviewed-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main-based branch
        uses: actions/checkout@v7
        with:
          ref: agent/failure-scenario-hardening-v3
          fetch-depth: 0
      - name: Copy already validated failure-hardening files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/failure-scenario-hardening
          git checkout FETCH_HEAD -- \
            CHANGELOG.md \
            cmd/router-applyd/confirmation.go \
            cmd/router-applyd/confirmation_test.go \
            cmd/router-applyd/main.go \
            cmd/router-applyd/outcome.go \
            docs/FAILURE_SCENARIOS.md \
            docs/README.md \
            internal/apply/failure_scenarios_test.go \
            internal/apply/ipc.go \
            internal/apply/recovery_required_test.go \
            internal/apply/statemachine.go
          gofmt -w \
            cmd/router-applyd/confirmation.go \
            cmd/router-applyd/confirmation_test.go \
            cmd/router-applyd/main.go \
            cmd/router-applyd/outcome.go \
            internal/apply/failure_scenarios_test.go \
            internal/apply/ipc.go \
            internal/apply/recovery_required_test.go \
            internal/apply/statemachine.go
      - name: Commit rebased failure hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md cmd/router-applyd docs internal/apply
          git commit -m "fix: rebase failure hardening onto startup recovery"
          git push
