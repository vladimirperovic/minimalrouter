name: Source snapshot

on:
  push:
    branches:
      - feature/alpha-1-1-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Archive source
        run: tar --exclude=.git -czf /tmp/minimalrouter-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: minimalrouter-source-${{ github.sha }}
          path: /tmp/minimalrouter-source.tar.gz
          retention-days: 1
