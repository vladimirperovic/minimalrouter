name: Apply Alpha 1.1 patch

on:
  push:
    branches:
      - feature/alpha-1-1-recovery
    paths:
      - .github/patch-ready
  pull_request:
    branches:
      - main
    paths:
      - .github/patch-ready

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository_owner == 'vladimirperovic' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/alpha-1-1-recovery
          fetch-depth: 0

      - name: Detect patch marker
        id: marker
        shell: bash
        run: |
          if [[ -f .github/patch-ready ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply reviewed patch
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-parts/part-* \
            | base64 --decode \
            | gzip -dc > /tmp/alpha-1-1.patch
          echo "9c8ea33d208d75e0027024303b760d23d0577a938d5cb93966a29e0b31b9b03f  /tmp/alpha-1-1.patch" \
            | sha256sum -c -

          # GitHub Actions tokens cannot modify workflow files. Apply the
          # reviewed application patch here and update workflows separately
          # through the repository connector after this commit lands.
          git apply --check --whitespace=error-all \
            --exclude='.github/workflows/*' \
            /tmp/alpha-1-1.patch
          git apply --index --whitespace=error-all \
            --exclude='.github/workflows/*' \
            /tmp/alpha-1-1.patch
          git rm -r .github/patch-parts .github/patch-ready

      - name: Commit and push implementation
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Minimal Router CI"
          git config user.email "minimalrouter-ci@users.noreply.github.com"
          git commit -m "feat: add IoT isolation and device schedules"
          git push origin HEAD:feature/alpha-1-1-recovery
