name: Wire recovery support bundle

on:
  push:
    branches: [fix/live-install-offline-boot]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-install-offline-boot
          fetch-depth: 0

      - name: Apply support wiring
        run: python3 .github/support-bundle-patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/router-recovery/main.go cmd/router-recovery/support.go
          go test ./cmd/router-recovery ./internal/recovery ./internal/network
          go vet ./cmd/router-recovery
          grep -F 'support-bundle' cmd/router-recovery/main.go
          grep -F 'excludes credentials' cmd/router-recovery/support.go || true
          git diff --check

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/router-recovery/main.go cmd/router-recovery/support.go
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add sanitized recovery support bundle'
          git push origin HEAD:fix/live-install-offline-boot
