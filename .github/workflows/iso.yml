name: Appliance ISO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build, install and boot MinimalRouter ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install ISO and VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 qemu-utils expect

      - name: Validate installer shell syntax and recovery wiring
        run: |
          sh -n packaging/alpine/build-iso.sh
          sh -n packaging/alpine/live-installer.sh
          sh -n packaging/alpine/install-console.sh
          sh -n packaging/alpine/install-dist.sh
          grep -F 'Welcome to Minimal Router OS.' packaging/alpine/install-console.sh
          grep -F 'If you are installing on Proxmox VE' packaging/alpine/install-console.sh
          grep -F 'You do not need to' packaging/alpine/install-console.sh
          grep -F 'Press Enter to continue' packaging/alpine/install-console.sh
          grep -F 'Minimal Router OS v%s' packaging/alpine/install-console.sh
          grep -F 'openssh-server' packaging/alpine/build-iso.sh
          grep -F 'configure_live_ssh' packaging/alpine/live-installer.sh
          grep -F 'configure_target_recovery' packaging/alpine/live-installer.sh
          grep -F 'chroot /mnt /bin/sh -c' packaging/alpine/live-installer.sh
          grep -F 'minimalrouter.console=ttyS0' packaging/alpine/build-iso.sh
          test -f scripts/ci/iso-full-install.exp

      - name: Build all-in-one ISO
        run: sh packaging/alpine/build-iso.sh

      - name: Verify ISO checksum and payload
        run: |
          sha256sum -c build/iso/minimalrouter-*-amd64.iso.sha256
          iso="$(ls build/iso/minimalrouter-*-amd64.iso)"
          xorriso -indev "$iso" -ls /minimalrouter 2>/dev/null | grep -F VERSION
          xorriso -indev "$iso" -ls / 2>/dev/null | grep -F minimalrouter.apkovl.tar.gz
          xorriso -indev "$iso" -ls /boot/grub 2>/dev/null | grep -F grub.cfg
          xorriso -indev "$iso" -report_el_torito plain 2>/dev/null | grep -F 'El Torito boot img'
          ls build/iso/apks/openssh-server-*.apk
          mkdir -p build/iso/apkovl-check
          tar -xzf build/iso/minimalrouter.apkovl.tar.gz -C build/iso/apkovl-check
          test -x build/iso/apkovl-check/etc/init.d/minimalrouter-installer
          test -L build/iso/apkovl-check/etc/runlevels/default/minimalrouter-installer

      - name: Boot ISO and verify installer service starts
        run: |
          set -eu
          iso="$(ls build/iso/minimalrouter-*-amd64.iso)"
          truncate -s 8G build/iso/test-disk.raw
          set +e
          timeout 90 qemu-system-x86_64 \
            -machine pc,accel=tcg \
            -cpu max \
            -smp 1 \
            -m 1024 \
            -boot d \
            -cdrom "$iso" \
            -drive file=build/iso/test-disk.raw,format=raw,if=virtio \
            -netdev user,id=wan \
            -device virtio-net-pci,netdev=wan \
            -netdev user,id=lan \
            -device virtio-net-pci,netdev=lan \
            -display none \
            -serial stdio \
            -no-reboot \
            >build/iso/qemu-boot.log 2>&1
          rc=$?
          set -e
          # timeout is expected: the default installer UI is VGA/noVNC.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat build/iso/qemu-boot.log
            exit "$rc"
          fi
          cat build/iso/qemu-boot.log
          grep -F 'MinimalRouter installer service started; UI=' build/iso/qemu-boot.log
          grep -F 'serial=ttyS0@115200' build/iso/qemu-boot.log
          ! grep -F 'minimalrouter-installer: crashed' build/iso/qemu-boot.log

      - name: Install ISO to disk and boot installed appliance
        run: |
          set -eux
          iso="$(ls build/iso/minimalrouter-*-amd64.iso)"

          # The production ISO defaults to VGA/noVNC. For CI only, remaster a
          # byte-for-byte-equivalent payload whose BIOS default selects the
          # existing serial installer entry so Expect can drive the real wizard.
          cp build/iso/syslinux.cfg build/iso/syslinux-full-install.cfg
          sed -i 's/^DEFAULT minimalrouter$/DEFAULT minimalrouter-serial/' build/iso/syslinux-full-install.cfg
          xorriso \
            -indev "$iso" \
            -outdev build/iso/minimalrouter-full-install-test.iso \
            -boot_image any replay \
            -map build/iso/syslinux-full-install.cfg /boot/syslinux/syslinux.cfg \
            -commit \
            -end

          truncate -s 8G build/iso/full-install-disk.raw
          chmod +x scripts/ci/iso-full-install.exp
          timeout 1200 scripts/ci/iso-full-install.exp \
            build/iso/minimalrouter-full-install-test.iso \
            build/iso/full-install-disk.raw \
            build/iso/qemu-full-install.log
          grep -F 'FULL_ISO_INSTALL_OK' build/iso/qemu-full-install.log

      - name: Upload bootable ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimalrouter-appliance-iso-${{ github.sha }}
          path: |
            build/iso/minimalrouter-*-amd64.iso
            build/iso/minimalrouter-*-amd64.iso.sha256
            build/iso/APK-SHA256SUMS
            build/iso/qemu-boot.log
            build/iso/qemu-full-install.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
