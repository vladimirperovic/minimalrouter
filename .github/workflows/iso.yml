name: Appliance ISO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build, flash and boot minimalrouter golden ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install ISO, golden-image and VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso qemu-system-x86 qemu-utils expect sshpass \
            extlinux syslinux-common e2fsprogs util-linux

      - name: Validate golden-image architecture
        run: |
          sh -n packaging/alpine/build-iso.sh
          sh -n packaging/alpine/build-rootfs.sh
          sh -n packaging/alpine/build-golden-image.sh
          sh -n packaging/alpine/live-installer.sh
          sh -n packaging/alpine/firstboot.sh
          sh -n packaging/alpine/firstboot.initd

          grep -F 'install_model=golden-image' packaging/alpine/build-iso.sh
          grep -F 'build-golden-image.sh' packaging/alpine/build-iso.sh
          grep -F 'golden.img.gz' packaging/alpine/build-iso.sh
          # The flasher still decompresses the golden image straight into dd,
          # and must verify both halves of that pipeline: a shell pipeline
          # reports only dd's status, so a decompressor that dies after partial
          # output would otherwise look like a successful install.
          grep -F "gzip -dc \"\$GOLDEN\"" packaging/alpine/live-installer.sh
          grep -F "| dd of=\"\$disk\" bs=4M" packaging/alpine/live-installer.sh
          grep -F 'gz_status_file' packaging/alpine/live-installer.sh
          grep -F 'golden.img.bytes' packaging/alpine/live-installer.sh
          grep -F 'safe_auto_vm_disk' packaging/alpine/live-installer.sh
          grep -F 'guard_existing_install' packaging/alpine/live-installer.sh
          grep -F 'installed_by=golden-image' packaging/alpine/build-golden-image.sh
          grep -F "root=UUID=\$ROOT_UUID rootfstype=ext4" packaging/alpine/build-golden-image.sh
          grep -F "UUID=\$ROOT_UUID / ext4" packaging/alpine/build-golden-image.sh
          grep -F 'before networking sshd router-applyd routerd' packaging/alpine/firstboot.initd
          grep -F 'router-setup collect' packaging/alpine/firstboot.sh
          grep -F 'INSTALLED_SSH_OK' scripts/ci/iso-full-install.exp
          grep -F 'CHECK_KERNEL_MODULE_MATCH_OK' scripts/ci/iso-full-install.exp
          grep -F 'INSTALLED_REBOOT_MATRIX_OK' scripts/ci/iso-installed-reboot.exp
          grep -F 'ROUTERD_CRASH_RECOVERY_OK' scripts/ci/iso-installed-reboot.exp
          grep -F 'EXISTING_INSTALL_GUARD_OK' scripts/ci/iso-installer-safety.exp
          grep -F 'UNDERSIZED_DISK_GUARD_OK' scripts/ci/iso-installer-safety.exp

          # The user's VM is a flasher target, never an Alpine build host.
          if grep -E '^[[:space:]]*apk[[:space:]]+(add|update|fix)' packaging/alpine/live-installer.sh; then
            echo 'ERROR: live installer must not run apk package transactions' >&2
            exit 1
          fi
          if grep -E '^[[:space:]]*(chroot|mkinitfs|setup-disk|sfdisk)[[:space:]]' packaging/alpine/live-installer.sh; then
            echo 'ERROR: live installer contains a forbidden target build/install command' >&2
            exit 1
          fi
          if grep -E '^[[:space:]]*mkfs\.' packaging/alpine/live-installer.sh; then
            echo 'ERROR: live installer must not build filesystems' >&2
            exit 1
          fi
          if grep -F 'install-core.sh' packaging/alpine/live-installer.sh; then
            echo 'ERROR: live installer must not rerun MinimalRouter installation' >&2
            exit 1
          fi
          if grep -F 'rootfs.tar.gz' packaging/alpine/live-installer.sh; then
            echo 'ERROR: live installer must flash the golden disk, not unpack rootfs' >&2
            exit 1
          fi
          if grep -F 'minimalrouter-target' packaging/alpine/live-installer.sh; then
            echo 'ERROR: live installer must not mount or patch the flashed target filesystem' >&2
            exit 1
          fi
          if grep -E 'mount[[:space:]].*(rootpart|TARGET|target)' packaging/alpine/live-installer.sh; then
            echo 'ERROR: live installer contains a target-filesystem mount' >&2
            exit 1
          fi

      - name: Build golden appliance ISO
        run: sh packaging/alpine/build-iso.sh

      - name: Verify ISO checksum and golden payload
        run: |
          sha256sum -c build/iso/minimalrouter-*-amd64.iso.sha256
          iso="$(ls build/iso/minimalrouter-*-amd64.iso)"
          xorriso -indev "$iso" -ls /minimalrouter 2>/dev/null | grep -F VERSION
          xorriso -indev "$iso" -ls /minimalrouter 2>/dev/null | grep -F BUILD-INFO
          xorriso -indev "$iso" -ls /minimalrouter 2>/dev/null | grep -F golden.img.gz
          xorriso -indev "$iso" -ls /minimalrouter 2>/dev/null | grep -F golden.img.gz.sha256
          xorriso -indev "$iso" -ls /minimalrouter 2>/dev/null | grep -F golden.img.bytes
          xorriso -indev "$iso" -ls / 2>/dev/null | grep -F minimalrouter.apkovl.tar.gz
          xorriso -indev "$iso" -ls /boot/grub 2>/dev/null | grep -F grub.cfg
          xorriso -indev "$iso" -report_el_torito plain 2>/dev/null | grep -F 'El Torito boot img'

          gzip -t build/iso/minimalrouter-golden-*-amd64.img.gz
          test -s build/iso/minimalrouter-golden-*-amd64.img.gz.sha256
          mkdir -p build/iso/apkovl-check
          tar -xzf build/iso/minimalrouter.apkovl.tar.gz -C build/iso/apkovl-check
          test -x build/iso/apkovl-check/etc/init.d/minimalrouter-installer
          test -L build/iso/apkovl-check/etc/runlevels/default/minimalrouter-installer

      - name: Boot production ISO and verify flasher starts automatically
        run: |
          set -eu
          iso="$(ls build/iso/minimalrouter-*-amd64.iso)"
          # Production deliberately owns tty1/VGA so Proxmox noVNC sees the UI.
          # Serial only receives the service marker. The next end-to-end step
          # remasters only the boot-menu default and exercises the full flasher.
          truncate -s 4G build/iso/test-disk.raw
          set +e
          timeout 90 qemu-system-x86_64 \
            -machine pc,accel=tcg \
            -cpu max \
            -smp 1 \
            -m 1024 \
            -boot d \
            -cdrom "$iso" \
            -drive file=build/iso/test-disk.raw,format=raw,if=virtio \
            -display none \
            -serial stdio \
            -no-reboot \
            >build/iso/qemu-boot.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat build/iso/qemu-boot.log
            exit "$rc"
          fi
          cat build/iso/qemu-boot.log
          grep -F 'MinimalRouter installer service started; UI=tty1; serial=ttyS0@115200' build/iso/qemu-boot.log
          if grep -F 'minimalrouter-installer: crashed' build/iso/qemu-boot.log; then
            echo 'ERROR: production flasher service crashed' >&2
            exit 1
          fi

      - name: Flash ISO, complete firstboot and verify installed appliance
        run: |
          set -eux
          iso="$(ls build/iso/minimalrouter-*-amd64.iso)"

          # Production defaults to VGA/noVNC. CI changes only the boot-menu
          # default so Expect can drive the same flasher and firstboot over ttyS0.
          cp build/iso/syslinux.cfg build/iso/syslinux-full-install.cfg
          sed -i 's/^DEFAULT minimalrouter$/DEFAULT minimalrouter-serial/' build/iso/syslinux-full-install.cfg
          xorriso \
            -indev "$iso" \
            -outdev build/iso/minimalrouter-full-install-test.iso \
            -boot_image any replay \
            -map build/iso/syslinux-full-install.cfg /boot/syslinux/syslinux.cfg \
            -commit \
            -end

          truncate -s 8G build/iso/full-install-disk.raw
          chmod +x scripts/ci/iso-full-install.exp
          timeout 1500 scripts/ci/iso-full-install.exp \
            build/iso/minimalrouter-full-install-test.iso \
            build/iso/full-install-disk.raw \
            build/iso/qemu-full-install.log
          grep -F 'FULL_ISO_INSTALL_OK' build/iso/qemu-full-install.log
          grep -F 'INSTALLED_SSH_OK' build/iso/qemu-full-install.log

      - name: Cold boot, crash-recover and reboot the installed appliance
        run: |
          set -eux
          chmod +x scripts/ci/iso-installed-reboot.exp
          timeout 900 scripts/ci/iso-installed-reboot.exp \
            build/iso/full-install-disk.raw \
            build/iso/qemu-installed-reboot.log
          grep -F 'INSTALLED_COLD_BOOT_OK' build/iso/qemu-installed-reboot.log
          grep -F 'ROUTERD_CRASH_RECOVERY_OK' build/iso/qemu-installed-reboot.log
          grep -F 'INSTALLED_WARM_REBOOT_OK' build/iso/qemu-installed-reboot.log
          grep -F 'INSTALLED_REBOOT_MATRIX_OK' build/iso/qemu-installed-reboot.log

      - name: Verify destructive installer safety guards
        run: |
          set -eux
          chmod +x scripts/ci/iso-installer-safety.exp
          timeout 300 scripts/ci/iso-installer-safety.exp \
            existing \
            build/iso/minimalrouter-full-install-test.iso \
            build/iso/full-install-disk.raw \
            build/iso/qemu-existing-install-guard.log
          grep -F 'EXISTING_INSTALL_GUARD_OK' build/iso/qemu-existing-install-guard.log

          truncate -s 4G build/iso/undersized-install-disk.raw
          timeout 300 scripts/ci/iso-installer-safety.exp \
            small \
            build/iso/minimalrouter-full-install-test.iso \
            build/iso/undersized-install-disk.raw \
            build/iso/qemu-undersized-disk.log
          grep -F 'UNDERSIZED_DISK_GUARD_OK' build/iso/qemu-undersized-disk.log

      - name: Upload tested bootable ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimalrouter-appliance-iso-${{ github.sha }}
          path: |
            build/iso/minimalrouter-*-amd64.iso
            build/iso/minimalrouter-*-amd64.iso.sha256
            build/iso/qemu-boot.log
            build/iso/qemu-full-install.log
            build/iso/qemu-installed-reboot.log
            build/iso/qemu-existing-install-guard.log
            build/iso/qemu-undersized-disk.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
