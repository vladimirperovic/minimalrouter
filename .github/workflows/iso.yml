name: Appliance ISO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build and boot MinimalRouter ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install ISO and VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86 qemu-utils

      - name: Validate installer shell syntax
        run: |
          sh -n packaging/alpine/build-iso.sh
          sh -n packaging/alpine/live-installer.sh
          sh -n packaging/alpine/install-console.sh
          sh -n packaging/alpine/install-dist.sh

      - name: Build all-in-one ISO
        run: sh packaging/alpine/build-iso.sh

      - name: Verify ISO checksum and payload
        run: |
          sha256sum -c build/iso/minimalrouter-*-amd64.iso.sha256
          iso="$(ls build/iso/minimalrouter-*-amd64.iso)"
          xorriso -indev "$iso" -find /minimalrouter/VERSION -print | grep -q /minimalrouter/VERSION
          xorriso -indev "$iso" -find /minimalrouter.apkovl.tar.gz -print | grep -q /minimalrouter.apkovl.tar.gz

      - name: Boot ISO and verify installer welcome
        run: |
          set -eu
          iso="$(ls build/iso/minimalrouter-*-amd64.iso)"
          truncate -s 8G build/iso/test-disk.raw
          set +e
          timeout 180 qemu-system-x86_64 \
            -machine pc,accel=tcg \
            -cpu max \
            -smp 1 \
            -m 1024 \
            -boot d \
            -cdrom "$iso" \
            -drive file=build/iso/test-disk.raw,format=raw,if=virtio \
            -netdev user,id=wan \
            -device virtio-net-pci,netdev=wan \
            -netdev user,id=lan \
            -device virtio-net-pci,netdev=lan \
            -display none \
            -serial stdio \
            -no-reboot \
            >build/iso/qemu-boot.log 2>&1
          rc=$?
          set -e
          # timeout is expected because the interactive installer waits for Enter.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat build/iso/qemu-boot.log
            exit "$rc"
          fi
          cat build/iso/qemu-boot.log
          grep -F "Minimal Router OS v$(cat VERSION)" build/iso/qemu-boot.log
          grep -F "Welcome to Minimal Router OS." build/iso/qemu-boot.log
          grep -F "Press Enter to continue" build/iso/qemu-boot.log

      - name: Upload bootable ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimalrouter-appliance-iso-${{ github.sha }}
          path: |
            build/iso/minimalrouter-*-amd64.iso
            build/iso/minimalrouter-*-amd64.iso.sha256
            build/iso/APK-SHA256SUMS
            build/iso/qemu-boot.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
