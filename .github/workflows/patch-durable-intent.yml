name: Diagnose durable intent patch

on:
  push:
    branches:
      - agent/failure-hardening-round2
    paths:
      - .github/workflows/patch-durable-intent.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/failure-hardening-round2
      - name: Record exact patch preconditions
        shell: python
        run: |
          from pathlib import Path

          main = Path("cmd/router-applyd/main.go").read_text()
          outcome = Path("cmd/router-applyd/outcome.go").read_text()
          validation = Path("cmd/router-applyd/persistence_validation_test.go").read_text()
          persistence = Path("cmd/router-applyd/persistence_outcome_test.go").read_text()
          patterns = {
              "transaction struct": '''type transactionRecord struct {
          \tID          string              `json:"id"`
          \tConfigHash  string              `json:"config_hash"`
          \tResponse    apply.ApplyResponse `json:"response"`
          \tCompletedAt time.Time           `json:"completed_at"`
          }''',
              "operation block": '''\tlog.Printf("apply transaction %q revision %d", req.ID, req.Revision)
          \tvar resp apply.ApplyResponse
          \tif req.Op == apply.OpConfirm {
          \t\tresp = confirmApply(req)
          \t} else {
          \t\tresp = applyAll(req)
          \t}
          \trecord := transactionRecord{
          \t\tID: req.ID, ConfigHash: configHash, Response: resp, CompletedAt: time.Now(),
          \t}
          \trecord, resp = persistTransactionOutcome(record, saveLastTransaction)
          \tlastTransactionMemory = &record
          \twriteResponse(conn, resp)''',
              "record validator": '''func validateTransactionRecord(record transactionRecord) error {
          \tif !transactionIDPattern.MatchString(record.ID) {
          \t\treturn errors.New("transaction record has an invalid ID")
          \t}
          \tdigest, err := hex.DecodeString(record.ConfigHash)
          \tif err != nil || len(digest) != sha256.Size {
          \t\treturn errors.New("transaction record has an invalid configuration fingerprint")
          \t}
          \tif record.CompletedAt.IsZero() {
          \t\treturn errors.New("transaction record has no completion time")
          \t}
          \tif record.Response.ID != record.ID {
          \t\treturn errors.New("transaction record response ID does not match")
          \t}
          \tif err := record.Response.Validate(); err != nil {
          \t\treturn fmt.Errorf("transaction record response is invalid: %w", err)
          \t}
          \treturn nil
          }''',
              "replay block": '''\tif previous.ID != id {
          \t\treturn nil, false
          \t}
          \tif previous.ConfigHash != configHash {
          \t\tresponse := failure(id, "transaction ID was already used for different content", false)
          \t\treturn &response, true
          \t}
          \tresponse := previous.Response
          \treturn &response, true''',
              "valid record fixture": '''\t\tResponse: apply.ApplyResponse{
          \t\t\tID: "tx-valid-record", Success: true, Verified: true,
          \t\t},
          \t\tCompletedAt: time.Now(),''',
              "missing completion test": '''\t\t{name: "missing completion", mutate: func(r *transactionRecord) { r.CompletedAt = time.Time{} }},''',
          }
          sources = {
              "transaction struct": main,
              "operation block": main,
              "record validator": main,
              "replay block": outcome,
              "valid record fixture": validation,
              "missing completion test": validation,
          }
          lines = [f"{name}: {sources[name].count(pattern)}" for name, pattern in patterns.items()]
          lines.append(f"incomplete intent test already present: {'TestValidateTransactionRecordAcceptsDurableIncompleteIntent' in validation}")
          lines.append(f"incomplete replay test already present: {'TestReplayIncompleteIntentRequiresRecoveryWithoutReapply' in persistence}")
          Path("durable-intent-diagnostic.txt").write_text("\n".join(lines) + "\n")
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add durable-intent-diagnostic.txt
          git commit -m "test: record durable intent patch preconditions"
          git push
