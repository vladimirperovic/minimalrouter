name: Apply durable intent patch

on:
  push:
    branches:
      - agent/failure-hardening-round2
    paths:
      - .github/workflows/patch-durable-intent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/failure-hardening-round2
      - name: Apply reviewed patch
        run: python3 scripts/ci-patch-durable-intent.py
      - name: Format and capture focused tests
        shell: bash
        run: |
          set +e
          gofmt -w cmd/router-applyd/main.go cmd/router-applyd/outcome.go cmd/router-applyd/persistence_validation_test.go cmd/router-applyd/persistence_outcome_test.go
          go test ./cmd/router-applyd ./internal/apply > durable-intent-test.log 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> durable-intent-test.log
          exit 0
      - name: Commit patch and test log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/router-applyd durable-intent-test.log
          git commit -m "fix: journal privileged intent before side effects"
          git push
