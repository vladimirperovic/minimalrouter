# Minimal Router OS kernel hardening. router-applyd reasserts the
# interface-specific values during every verified apply.
net.ipv4.ip_forward=1
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_rfc1337=1
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0
net.ipv4.conf.all.proxy_arp=0
net.ipv4.conf.default.proxy_arp=0
net.ipv4.conf.all.route_localnet=0
net.ipv4.conf.default.route_localnet=0
net.ipv4.conf.all.log_martians=1
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1
# A router can legitimately receive asymmetric traffic through PPPoE,
# WireGuard, bridges, or future policy routing. Loose reverse-path filtering
# rejects unroutable spoofed sources without breaking those valid paths; the
# generated nftables policy performs stricter interface-specific anti-spoofing.
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
# Keep the state table explicitly bounded on the supported 512 MiB+ appliance
# class instead of inheriting a host/kernel-dependent conntrack ceiling.
net.netfilter.nf_conntrack_max=131072
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.unprivileged_bpf_disabled=1
net.core.bpf_jit_harden=2
fs.protected_hardlinks=1
fs.protected_symlinks=1
fs.protected_fifos=2
fs.protected_regular=2
