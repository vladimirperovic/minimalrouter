[package]
name = "minimalrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
argon2 = "0.5"
base64 = "0.23.1"
bcrypt = "0.15"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
hex = "0.4.3"
hmac = "0.12"
libc = "0.2.191"
log = "0.4.34"
pem = "3"
png = "0.17"
psl = "2"
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
regex = "1.13.1"
roxmltree = "0.21.2"
rusqlite = { version = "0.41.0", features = ["bundled", "fallible_uint"] }
ed25519-dalek = "2.1"
flate2 = "1"
tar = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_ignored = "0.1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6.1"
time = "0.3"
ureq = { version = "2", default-features = false, features = ["tls"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser = "0.16"

[target."cfg(unix)".dependencies]
signal-hook = "0.3"
