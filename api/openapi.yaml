openapi: 3.0.3
info:
  title: Minimal Router OS REST API
  description: Version 1 REST API contract for Minimal Router OS management plane (routerd).
  version: 1.3.0
servers:
  - url: https://192.168.1.1:8443/api/v1
    description: LAN HTTPS management endpoint
  - url: https://10.8.0.1:8443/api/v1
    description: Example authenticated WireGuard management endpoint

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mr_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  schemas:
    DNSFilterPolicy:
      type: object
      required: [revision, categories, exceptions]
      additionalProperties: false
      properties:
        revision: {type: integer, format: int64, minimum: 0, description: Independent optimistic concurrency revision; use the last read value when saving}
        categories:
          type: object
          additionalProperties: false
          properties:
            threats: {type: boolean}
            ads: {type: boolean}
            adult: {type: boolean}
            gambling: {type: boolean}
        exceptions:
          type: array
          maxItems: 200
          items:
            type: object
            required: [domain]
            properties:
              domain: {type: string, maxLength: 253, description: Canonical public domain and all its subdomains; no URL, IP, wildcard or public suffix}
              reason: {type: string, maxLength: 200}
    DNSFilterStatus:
      type: object
      required: [policy, domains, applied_at, healthy, updating, lists, next_refresh_at, router_time, timezone]
      properties:
        policy: {$ref: '#/components/schemas/DNSFilterPolicy'}
        domains: {type: integer, minimum: 0, description: Source entries; lists can overlap. Not a blocked query count.}
        applied_at: {type: integer, format: int64, description: Unix seconds; zero means never applied}
        healthy: {type: boolean, description: Local resolver loaded the saved generation; does not verify every query or client}
        updating: {type: boolean}
        error: {type: string}
        sources: {type: object, additionalProperties: {type: string, description: Applied catalog SHA-256}}
        next_refresh_at: {type: integer, format: int64, description: Earliest refresh eligibility; the worker checks hourly}
        router_time: {type: string, format: date-time}
        timezone: {type: string}
        lists:
          type: array
          items:
            type: object
            properties:
              category: {type: string, enum: [threats, ads, adult, gambling]}
              label: {type: string}
              url: {type: string, format: uri}
              hash: {type: string}
              entries: {type: integer, minimum: 0}
              updated_at: {type: integer, format: int64}
              error: {type: string}
    DNSCollectionStatus:
      type: object
      required: [state, last_success, dropped_lookups]
      properties:
        state: {type: string, enum: [starting, active, stale, degraded, unavailable, disabled]}
        last_success: {type: string, format: date-time, nullable: true}
        dropped_lookups: {type: integer, format: int64, minimum: 0, description: Helper drops since service start or history clear}
        error: {type: string}
    DNSRiskSource:
      type: object
      required: [category, label, source, url, entries, updated_at, attempted_at, stale, updating]
      properties:
        category: {type: string, enum: [adult, phishing, malware, fraud, gambling]}
        label: {type: string}
        source: {type: string}
        url: {type: string, format: uri}
        entries: {type: integer, format: int64, minimum: 0}
        updated_at: {type: integer, format: int64, description: Unix seconds of last successful verification; zero means never}
        attempted_at: {type: integer, format: int64}
        stale: {type: boolean, description: Missing list or last verification older than 48 hours}
        updating: {type: boolean}
        error: {type: string}
    DNSRiskSummary:
      type: object
      required: [available, enabled, new_count, total, last_checked_at, dropped_lookups, removed_alerts, sources, collection]
      properties:
        available: {type: boolean}
        enabled: {type: boolean}
        new_count: {type: integer, minimum: 0, description: Unreviewed alerts without an exception}
        total: {type: integer, minimum: 0}
        last_checked_at: {type: integer, format: int64}
        dropped_lookups: {type: integer, format: int64, minimum: 0, description: Risk-worker drops since service start or history clear}
        removed_alerts: {type: integer, format: int64, minimum: 0, description: Alerts removed at the 10000-record bound since clear}
        error: {type: string}
        sources: {type: array, items: {$ref: '#/components/schemas/DNSRiskSource'}}
        collection: {$ref: '#/components/schemas/DNSCollectionStatus'}
    DNSRiskAlert:
      type: object
      required: [id, domain, category, severity, first_seen, last_seen, lookups, last_address, acknowledged_at, ignored]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        domain: {type: string, description: Matched list domain; not a URL or proof of a visit}
        category: {type: string, enum: [adult, phishing, malware, fraud, gambling]}
        severity: {type: string, enum: [warning, high]}
        first_seen: {type: integer, format: int64}
        last_seen: {type: integer, format: int64}
        lookups: {type: integer, format: int64, minimum: 0}
        last_address: {type: string, description: Last observed IP; not a persistent device or person identity}
        acknowledged_at: {type: integer, format: int64, description: Unix seconds; zero means unreviewed}
        ignored: {type: boolean}
    DNSRiskPage:
      type: object
      required: [alerts, total, offset, limit]
      properties:
        alerts: {type: array, items: {$ref: '#/components/schemas/DNSRiskAlert'}}
        total: {type: integer, minimum: 0}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
    DNSRiskException:
      type: object
      required: [id, domain, category]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        domain: {type: string}
        category: {type: string, enum: [adult, phishing, malware, fraud, gambling]}
    DeviceUsage:
      type: object
      required: [address, rx_bytes, tx_bytes, total_bytes]
      properties:
        address: {type: string, description: Measured device IP address}
        hostname: {type: string, description: Label resolved from current DHCP configuration}
        mac: {type: string}
        rx_bytes: {type: integer, format: int64, minimum: 0}
        tx_bytes: {type: integer, format: int64, minimum: 0}
        total_bytes: {type: integer, format: int64, minimum: 0}
        last_seen_epoch:
          type: integer
          format: int64
          description: Collection time of a positive byte delta; not a presence probe or lease expiry.
    TrafficUsagePoint:
      type: object
      required: [start, rx_bytes, tx_bytes, total_bytes, samples, observed_seconds]
      properties:
        start: {type: string, format: date-time}
        rx_bytes: {type: integer, format: int64, minimum: 0}
        tx_bytes: {type: integer, format: int64, minimum: 0}
        total_bytes: {type: integer, format: int64, minimum: 0}
        samples: {type: integer, minimum: 0, description: Zero means no samples rather than measured zero traffic}
        observed_seconds: {type: integer, format: int64, minimum: 0}
    TrafficInsights:
      type: object
      required: [available, enabled, period, from, until, points, devices, rx_bytes, tx_bytes, total_bytes, observed_seconds]
      properties:
        available: {type: boolean}
        enabled: {type: boolean}
        period: {type: string, enum: [today, yesterday, 7d, 30d]}
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        history_started_at: {type: string, format: date-time, nullable: true}
        collected_at: {type: string, format: date-time, nullable: true}
        points:
          type: array
          items: {$ref: '#/components/schemas/TrafficUsagePoint'}
        devices:
          type: array
          items: {$ref: '#/components/schemas/DeviceUsage'}
        rx_bytes: {type: integer, format: int64, minimum: 0}
        tx_bytes: {type: integer, format: int64, minimum: 0}
        total_bytes: {type: integer, format: int64, minimum: 0}
        observed_seconds: {type: integer, format: int64, minimum: 0}
        peak_sample_mbps: {type: number, nullable: true, description: Maximum average rate over a collection interval}
    DNSActivitySettings:
      type: object
      required: [available, enabled, retention_days]
      properties:
        available: {type: boolean}
        enabled: {type: boolean}
        retention_days: {type: integer, minimum: 1, maximum: 90}
    DNSActivity:
      type: object
      required: [available, enabled, retention_days, period, from, until, total_lookups, unitemized_lookups, site_count, points, devices, sites, flagged]
      properties:
        collection: {$ref: '#/components/schemas/DNSCollectionStatus'}
        available: {type: boolean}
        enabled: {type: boolean}
        retention_days: {type: integer, minimum: 0, maximum: 90}
        period: {type: string, enum: [today, yesterday, 7d, 30d]}
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        device: {type: string, description: IP address the summary is limited to}
        search: {type: string}
        history_started_at: {type: string, format: date-time, nullable: true}
        collected_at: {type: string, format: date-time, nullable: true}
        total_lookups: {type: integer, format: int64, minimum: 0}
        unitemized_lookups: {type: integer, format: int64, minimum: 0, description: Lookups counted after a memory or per-day row bound was reached, without a device or site}
        site_count: {type: integer, minimum: 0}
        points:
          type: array
          items:
            type: object
            required: [start, lookups, observed]
            properties:
              start: {type: string, format: date-time}
              lookups: {type: integer, format: int64, minimum: 0}
              observed: {type: boolean}
        devices:
          type: array
          items:
            type: object
            required: [address, lookups, sites, last_seen]
            properties:
              address: {type: string}
              hostname: {type: string}
              mac: {type: string}
              lookups: {type: integer, format: int64, minimum: 0}
              sites: {type: integer, minimum: 0}
              last_seen: {type: integer, format: int64}
        sites:
          type: array
          items:
            type: object
            required: [site, lookups, devices, first_seen, last_seen]
            properties:
              site: {type: string}
              category: {type: string, description: Device-profile service the site belongs to, e.g. adult}
              lookups: {type: integer, format: int64, minimum: 0}
              devices: {type: integer, minimum: 0}
              first_seen: {type: integer, format: int64}
              last_seen: {type: integer, format: int64}
        flagged:
          type: array
          description: Per-device use of sites that belong to a device-profile service category
          items:
            type: object
            required: [address, site, lookups, first_seen, last_seen]
            properties:
              address: {type: string}
              hostname: {type: string}
              site: {type: string}
              category: {type: string}
              lookups: {type: integer, format: int64, minimum: 0}
              first_seen: {type: integer, format: int64}
              last_seen: {type: integer, format: int64}
    FirewallActivity:
      type: object
      required: [available, from, until, collected_at, points, allowed, blocked]
      properties:
        available: {type: boolean, description: A collection is fresh within three minutes}
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        collected_at: {type: string, format: date-time, nullable: true}
        allowed: {type: integer, format: int64, minimum: 0}
        blocked: {type: integer, format: int64, minimum: 0}
        points:
          type: array
          items:
            type: object
            required: [start, allowed, blocked, samples]
            properties:
              start: {type: string, format: date-time}
              allowed: {type: integer, format: int64, minimum: 0}
              blocked: {type: integer, format: int64, minimum: 0}
              samples: {type: integer, minimum: 0}
    InterfaceInfo:
      type: object
      required: [name, up, carrier, physical, default_route, score]
      properties:
        name:
          type: string
          description: Linux interface name
        mac_address:
          type: string
          nullable: true
        up:
          type: boolean
        carrier:
          type: boolean
        physical:
          type: boolean
        default_route:
          type: boolean
        score:
          type: integer
          description: Recommendation score only; the operator must confirm WAN and LAN roles

    InterfaceDiscovery:
      type: object
      required: [interfaces, warnings]
      properties:
        wan:
          type: string
          description: Recommended WAN interface when a distinct pair can be selected
        lan:
          type: string
          description: Recommended LAN interface when a distinct pair can be selected
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/InterfaceInfo'
        warnings:
          type: array
          items:
            type: string

    AccessWindow:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '19:00'
        end:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '23:59'

    DayWindowMap:
      type: object
      additionalProperties: false
      description: Independent local-router-time access windows for each day. An omitted or empty day is blocked.
      properties:
        monday:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'
        tuesday:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'
        wednesday:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'
        thursday:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'
        friday:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'
        saturday:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'
        sunday:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'

    WeeklyAccessSchedule:
      type: object
      description: New writes use day_windows. Legacy weekday/weekend fields remain readable for backup compatibility and must not be mixed with day_windows.
      properties:
        day_windows:
          $ref: '#/components/schemas/DayWindowMap'
        weekday_windows:
          type: array
          deprecated: true
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'
        weekend_mode:
          type: string
          deprecated: true
          enum: [all_day, blocked, same_as_weekdays, custom]
        weekend_windows:
          type: array
          deprecated: true
          maxItems: 12
          items:
            $ref: '#/components/schemas/AccessWindow'

    DeviceProfile:
      type: object
      required: [id, name, ip_addresses, services, schedule, enabled]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        name:
          type: string
          maxLength: 64
        ip_addresses:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: ipv4
        services:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [youtube, steam, wiki, tiktok, instagram, facebook, roblox, epic, twitch, adult, gaming]
        schedule:
          $ref: '#/components/schemas/WeeklyAccessSchedule'
        enabled:
          type: boolean

    DNSFilterConfig:
      type: object
      required: [enabled, device_profiles]
      properties:
        enabled:
          type: boolean
        blocklist_url:
          type: string
          description: External refresh remains unavailable in the hardened pilot
        last_updated:
          type: string
        filter_devices:
          type: array
          deprecated: true
          description: Legacy import field; new writes must leave this empty
          items:
            type: object
        device_profiles:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/DeviceProfile'

    SystemConfig:
      type: object
      description: Complete canonical configuration. Unlisted fields remain part of the versioned model.
      additionalProperties: true
      properties:
        revision:
          type: integer
          minimum: 1
        trusted_networks:
          type: array
          description: Source networks allowed to reach the administrative Web UI/API. Does not replace authentication.
          items:
            type: string
            example: 192.168.1.0/24
        adguard:
          allOf:
            - $ref: '#/components/schemas/DNSFilterConfig'
          description: Compatibility JSON key; user-facing name is DNS Filter

paths:
  /accounting:
    get:
      summary: Read retained monthly device traffic totals
      description: Local optional accounting; updated_at is API response time. Disabled accounting returns no device history.
      security: [{sessionCookie: []}]
      parameters:
        - in: query
          name: months
          schema: {type: integer, minimum: 1, maximum: 24, default: 3}
      responses:
        '200':
          description: No-store monthly snapshot from a trusted management network
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: {type: boolean}
                  enabled: {type: boolean}
                  updated_at: {type: string, format: date-time}
                  months:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        month: {type: string, example: '2026-01'}
                        total_bytes: {type: integer, format: int64}
                        devices:
                          type: array
                          items: {$ref: '#/components/schemas/DeviceUsage'}
        '400': {description: Invalid month limit}
        '401': {description: Authentication required}
        '403': {description: Untrusted management network}
        '503': {description: Accounting storage unavailable}
  /accounting/insights:
    get:
      summary: Read bounded local traffic history and device distribution
      description: UTC hourly or daily aggregates sampled every five minutes; no historical backfill. Disabled accounting hides retained device history.
      security: [{sessionCookie: []}]
      parameters:
        - in: query
          name: period
          schema: {type: string, enum: [today, yesterday, 7d, 30d], default: today}
      responses:
        '200':
          description: No-store bounded snapshot; missing samples are gaps
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrafficInsights'}
        '400': {description: Unsupported period}
        '401': {description: Authentication required}
        '403': {description: Untrusted management network}
        '503': {description: Traffic storage unavailable}
  /dns-filter:
    get:
      summary: Read applied network DNS policy and maintained list health
      operationId: getDNSFilter
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Applied policy; new categories are off until explicitly enabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSFilterStatus'}
        '503': {description: DNS filter helper unavailable}
    put:
      summary: Queue a revision-bound network DNS policy change
      description: Downloads and validates enabled lists before activating. Poll GET for completion or error; a 202 response is not proof of activation. Previous verified rules survive failed refreshes. DNS Activity notification exceptions are separate.
      operationId: setDNSFilter
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DNSFilterPolicy'}
      responses:
        '202': {description: Update queued; response contains updating true}
        '409': {description: Another update is running}
        '422': {description: Invalid policy}
        '503': {description: DNS filtering unavailable}
  /dns-filter/refresh:
    post:
      summary: Queue a refresh of enabled blocking lists
      description: Limited to once per five minutes. Poll the status endpoint for completion.
      operationId: refreshDNSFilter
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '202': {description: Refresh queued}
        '409': {description: Update already running or refresh cooldown}
        '503': {description: DNS filtering unavailable}
  /dns-filter/check:
    post:
      summary: Check a domain against local blocking catalogs and exceptions
      description: Does not send the queried domain to an external service. Results describe configured policy, not an observed visit or a blocked query; local DNS records take precedence.
      operationId: checkDNSFilterDomain
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: {type: string}
      responses:
        '200':
          description: Local policy result
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: {type: string}
                  action: {type: string, enum: [Block, Allow exception, No category block]}
                  exception: {type: boolean}
                  healthy: {type: boolean}
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        category: {type: string, enum: [threats, ads, adult, gambling, bundled]}
                        domain: {type: string, description: Matching domain or parent}
                        enabled: {type: boolean}
        '422': {description: Invalid domain or installed index unavailable}
        '503': {description: DNS filtering unavailable}

  /dns-activity/alerts/summary:
    get:
      summary: Read network-wide DNS risk counts and monitoring coverage
      description: Opt-in via DNS activity recording. Counts hide disabled history. List classification runs locally and does not change DNS answers. Responses are no-store.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Counts and source/collector state; unavailable is never evidence of safe traffic
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSRiskSummary'}
        '401': {description: Authentication required}
        '403': {description: Untrusted network}
        '503': {description: Status unavailable}
  /dns-activity/alerts:
    get:
      summary: List matched domains across the whole network
      description: One record per UTC day, matched list domain and category. At most 10000 alerts follow the DNS retention setting. A DNS request can be background traffic and does not establish a visit or a blocked answer. No-store.
      security: [{sessionCookie: []}]
      parameters:
        - {in: query, name: view, schema: {type: string, enum: [new, all], default: new}}
        - {in: query, name: category, schema: {type: string, enum: [adult, phishing, malware, fraud, gambling]}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000, default: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: New excludes reviewed/ignored alerts; all retains both. Disabled recording returns an empty page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSRiskPage'}
        '400': {description: Invalid filter or pagination}
        '401': {description: Authentication required}
        '403': {description: Untrusted network}
        '503': {description: Monitoring unavailable}
  /dns-activity/alerts/{id}/acknowledge:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      summary: Mark one daily DNS alert as reviewed
      description: A later UTC day can alert again. Does not change DNS or firewall policy.
      security: [{sessionCookie: [], csrfToken: []}]
      responses:
        '200': {description: Alert reviewed}
        '400': {description: Invalid ID}
        '401': {description: Authentication required}
        '403': {description: Untrusted network, invalid CSRF token or read-only session}
        '404': {description: Alert not found}
        '503': {description: Monitoring unavailable}
  /dns-activity/alerts/{id}/ignore:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      summary: Suppress notifications for this matched domain and category
      description: Creates an exact domain/category exception, up to 500 entries. The exception survives history deletion and disabling. Ignored alerts remain in all-alerts history. Does not allow or block traffic.
      security: [{sessionCookie: [], csrfToken: []}]
      responses:
        '200': {description: Exception saved}
        '400': {description: Invalid ID}
        '401': {description: Authentication required}
        '403': {description: Untrusted network, invalid CSRF token or read-only session}
        '404': {description: Alert not found}
        '503': {description: Monitoring unavailable or exception limit reached}
  /dns-activity/alerts/exceptions:
    get:
      summary: List saved domain/category notification exceptions
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Saved exceptions, also accessible when recording is off; no-store
          content:
            application/json:
              schema:
                type: object
                required: [exceptions]
                properties:
                  exceptions: {type: array, items: {$ref: '#/components/schemas/DNSRiskException'}}
        '401': {description: Authentication required}
        '403': {description: Untrusted network}
        '503': {description: Monitoring unavailable}
  /dns-activity/alerts/exceptions/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    delete:
      summary: Remove a notification exception
      security: [{sessionCookie: [], csrfToken: []}]
      responses:
        '200': {description: Exception removed; unreviewed retained matches can alert again}
        '400': {description: Invalid ID}
        '401': {description: Authentication required}
        '403': {description: Untrusted network, invalid CSRF token or read-only session}
        '404': {description: Exception not found}
        '503': {description: Monitoring unavailable}
  /dns-activity/alerts/refresh:
    post:
      summary: Queue a refresh of the five fixed public category lists
      description: Lists normally refresh every 24 hours while recording is enabled. Failed downloads preserve the previous validated list; retry is every six hours. Manual requests are limited to one per five minutes. No arbitrary URLs or observed domains are sent to the provider.
      security: [{sessionCookie: [], csrfToken: []}]
      responses:
        '202': {description: Update queued; poll summary for source state}
        '401': {description: Authentication required}
        '403': {description: Untrusted network, invalid CSRF token or read-only session}
        '409': {description: Recording is disabled}
        '429': {description: Refresh requested too recently; Retry-After is 300 seconds}
        '503': {description: Monitoring unavailable}
  /dns-activity:
    get:
      summary: Read DNS lookup statistics per device and site
      description: Opt-in. Daily lookup counts per device and registrable site, UTC hourly totals for the chart, and per-device use of categorized sites. Individual queries are not stored. Disabled DNS activity hides retained history, which the collector then deletes.
      security: [{sessionCookie: []}]
      parameters:
        - in: query
          name: period
          schema: {type: string, enum: [today, yesterday, 7d, 30d], default: today}
        - in: query
          name: device
          schema: {type: string, description: IPv4 or IPv6 address}
        - in: query
          name: q
          schema: {type: string, maxLength: 64, pattern: '^[a-z0-9._-]*$'}
      responses:
        '200':
          description: No-store bounded summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSActivity'}
        '400': {description: Unsupported period, device or search}
        '401': {description: Authentication required}
        '403': {description: Untrusted management network}
        '503': {description: DNS activity storage unavailable}
  /dns-activity/settings:
    get:
      summary: Read the DNS activity recording setting
      description: Kept in routerd's local accounting store, not in the canonical configuration. Recording is off until enabled.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Current setting
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSActivitySettings'}
        '401': {description: Authentication required}
        '403': {description: Untrusted management network}
        '503': {description: DNS activity unavailable}
    put:
      summary: Turn DNS activity recording on or off and set retention
      description: Takes effect within seconds. Enabling installs a fixed dnsmasq drop-in that logs queries to tmpfs and restarts dnsmasq; if dnsmasq rejects it, the drop-in is removed again. Disabling removes the drop-in and deletes recorded history. Changes are audited.
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, retention_days]
              properties:
                enabled: {type: boolean}
                retention_days: {type: integer, minimum: 1, maximum: 90}
      responses:
        '200':
          description: Stored setting
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DNSActivitySettings'}
        '400': {description: Invalid setting}
        '401': {description: Authentication required}
        '403': {description: Untrusted management network, missing CSRF token or read-only session}
        '503': {description: DNS activity unavailable}
  /dns-activity/recent:
    get:
      summary: Read the most recent DNS lookups held in memory
      description: Full hostnames from the last collection rounds. Held only in routerd memory (at most 2,000 entries) and lost on restart.
      security: [{sessionCookie: []}]
      parameters:
        - in: query
          name: device
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 2000, default: 200}
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [available, enabled, entries]
                properties:
                  available: {type: boolean}
                  enabled: {type: boolean}
                  entries:
                    type: array
                    items:
                      type: object
                      required: [at, address, name, site, count]
                      properties:
                        at: {type: string, format: date-time}
                        address: {type: string}
                        hostname: {type: string}
                        name: {type: string}
                        site: {type: string}
                        category: {type: string}
                        count: {type: integer, minimum: 1}
        '400': {description: Invalid device or limit}
        '401': {description: Authentication required}
        '403': {description: Untrusted management network}
  /dns-activity/clear:
    post:
      summary: Delete all DNS activity history and risk alerts
      description: Also invalidates queued risk checks. Saved exceptions and downloaded public lists remain.
      description: Deletes stored daily and hourly statistics and the in-memory recent list. Recorded in the audit log.
      security: [{sessionCookie: []}]
      responses:
        '200': {description: History deleted}
        '401': {description: Authentication required}
        '403': {description: Untrusted management network, missing CSRF token or read-only session}
        '503': {description: DNS activity unavailable}
  /firewall/activity:
    get:
      summary: Read the last 24 hours of aggregate firewall packet activity
      description: Local input/forward allowed and blocked packets, grouped into half-hour buckets from minute samples. Independent of device accounting; resets and collection gaps are excluded. Current connection count remains in the system runtime endpoint.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: No-store aggregate snapshot with freshness and sample counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallActivity'}
        '401': {description: Authentication required}
        '403': {description: Untrusted management network}
        '503': {description: Activity storage unavailable}
  /auth/login:
    post:
      summary: Authenticate administrator and establish session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 15
                totp_code:
                  type: string
                  description: Current TOTP code when TOTP is enabled
                read_only:
                  type: boolean
                  default: false
                  description: Issue a server-enforced observer session
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: >-
            Invalid password, or a missing, wrong or replayed TOTP code. Every
            credential failure returns the same body
            (`{"error": "TOTP code required", "totp_required": "true"}`) so the
            response never reveals which factor was wrong.
        '429':
          description: Rate limit exceeded

  /auth/logout:
    post:
      summary: Terminate active administrator session
      operationId: logout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Logged out successfully

  /auth/session:
    get:
      summary: Retrieve current session and CSRF token info
      operationId: getSessionInfo
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                  read_only:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  last_seen:
                    type: string
                    format: date-time

  /setup/interfaces:
    get:
      summary: Discover candidate interfaces during first-run setup
      description: Available only before administrator credentials exist. Recommendations never replace operator confirmation.
      operationId: discoverSetupInterfaces
      responses:
        '200':
          description: Candidate interfaces and recommended distinct WAN/LAN pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceDiscovery'
        '404':
          description: First-run setup is already complete
        '503':
          description: Linux interface discovery is unavailable

  /system:
    get:
      summary: Retrieve system health, CPU, memory, uptime, and metadata
      operationId: getSystemStatus
      security:
        - sessionCookie: []
      responses:
        '200':
          description: System status summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                  wan_iface:
                    type: string
                  lan_ip:
                    type: string
                  revision:
                    type: integer
                  update_trust_configured:
                    type: boolean
                  runtime:
                    type: object
                    description: Real Linux runtime telemetry; available=false in the macOS preview
                    properties:
                      dhcp_leases:
                        type: array
                        description: Current bounded dnsmasq IPv4 lease table; empty when unavailable
                        items:
                          type: object
                          required: [expires_at, mac, ip_address]
                          properties:
                            expires_at:
                              type: integer
                              format: int64
                            mac:
                              type: string
                            ip_address:
                              type: string
                              format: ipv4
                            hostname:
                              type: string

  /system/interfaces:
    get:
      summary: Discover current Linux interface candidates
      operationId: discoverSystemInterfaces
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Candidate interfaces and recommendation signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceDiscovery'
        '503':
          description: Linux interface discovery is unavailable

  /config:
    get:
      summary: Get active canonical configuration model
      operationId: getConfig
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Canonical configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
    put:
      summary: Submit configuration update and execute transaction pipeline
      operationId: updateConfig
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfig'
      responses:
        '200':
          description: Transaction committed successfully
        '202':
          description: Provisionally applied; connectivity confirmation required
        '403':
          description: CSRF failure or read-only session
        '422':
          description: Validation or preflight check failed

  /snapshots:
    get:
      summary: List all immutable configuration snapshots
      description: >-
        Each snapshot carries `kind`: `automatic` (taken before every applied
        change and by the recovery console) or `manual` (created through this
        API). The newest 20 of each kind are retained independently.
      operationId: listSnapshots
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of snapshots
        '500':
          description: Snapshot history could not be read
    post:
      summary: Create an immutable checksummed manual configuration snapshot
      operationId: createSnapshot
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Snapshot created

  /snapshots/{id}/restore:
    post:
      summary: Restore a previous snapshot
      operationId: restoreSnapshot
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshot restored successfully
        '202':
          description: Snapshot provisionally restored; connectivity confirmation required

  /wireguard/peers:
    post:
      summary: Provision a WireGuard peer and return its client configuration once
      description: The client private key is returned only in this no-store response and is never persisted.
      operationId: provisionWireGuardPeer
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, client_ip_address, server_endpoint]
              properties:
                name:
                  type: string
                client_ip_address:
                  type: string
                  example: 10.8.0.2
                server_endpoint:
                  type: string
                  example: router.example.net:51820
      responses:
        '200':
          description: Peer committed; one-time client .conf and PNG QR returned
        '202':
          description: Peer provisionally applied; connectivity confirmation required before it becomes canonical
        '409':
          description: WAN is not configured
        '422':
          description: Invalid or duplicate peer settings

  /wireguard/peers/{id}:
    delete:
      summary: Delete an existing WireGuard peer
      description: Removes the peer through the normal validated and rollback-capable configuration transaction.
      operationId: deleteWireGuardPeer
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Peer deleted and configuration committed
        '202':
          description: Peer provisionally deleted; connectivity confirmation required
        '404':
          description: Peer not found
        '409':
          description: Several peers share the identifier; correct the configuration first
        '422':
          description: Deletion rejected by configuration safety validation

  /wireguard/peers/{id}/configuration:
    post:
      summary: Issue a new one-time client configuration for an existing peer
      description: Replaces the peer key material, invalidates the old client configuration, and returns the new private client configuration only in this no-store response.
      operationId: reissueWireGuardPeerConfiguration
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server_endpoint:
                  type: string
                  description: Optional endpoint override; Dynamic DNS is used when omitted.
                  example: router.example.net:51820
      responses:
        '200':
          description: Peer key replaced; one-time client .conf and PNG QR returned
        '202':
          description: Peer key provisionally replaced; connectivity confirmation required
        '404':
          description: Peer not found
        '422':
          description: Reissue rejected by validation or transaction safety

  /wireguard/provisioning-preview:
    get:
      summary: Report the client IP and endpoint the backend will assign to the next peer
      description: Authoritative allocation preview so the UI never duplicates backend logic.
      operationId: wireGuardProvisioningPreview
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Next free client IP and server endpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_ip:
                    type: string
                  server_endpoint:
                    type: string
                  ddns_configured:
                    type: boolean
                  wireguard_enabled:
                    type: boolean
        '409':
          description: WireGuard subnet exhausted

  /audit/events:
    get:
      summary: List bounded metadata-only security audit events
      description: Readable by administrator and read-only (MCP) sessions.
      operationId: listAuditEvents
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Audit events without request bodies or secrets

  /setup/status:
    get:
      summary: Read first-run and recovery status
      operationId: getSetupStatus
      responses:
        '200': { description: Setup status }

  /setup/apply:
    post:
      summary: Atomically apply the first verified network configuration and administrator credential
      operationId: applyInitialSetup
      responses:
        '200': { description: Initial setup committed }
        '503': { description: Setup entered recovery-required state }

  /auth/change-password:
    post:
      summary: Change the administrator password and revoke older auth generations
      operationId: changePassword
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': { description: Password changed }

  /auth/totp/enroll:
    post:
      summary: Create a pending TOTP enrollment
      operationId: enrollTOTP
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': { description: Enrollment secret created }

  /auth/totp/enable:
    post:
      summary: Confirm and enable pending TOTP enrollment
      operationId: enableTOTP
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': { description: TOTP enabled }

  /auth/totp/disable:
    post:
      summary: Disable TOTP after password and TOTP verification
      operationId: disableTOTP
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': { description: TOTP disabled }

  /system/diagnostics:
    get:
      summary: Download redacted diagnostics JSON
      operationId: getDiagnostics
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Diagnostics document
          content:
            application/json:
              schema: { type: object }

  /transactions/pending:
    get:
      summary: Read the current commit-confirm transaction
      operationId: getPendingTransaction
      security:
        - sessionCookie: []
      responses:
        '200': { description: Pending transaction or pending=false }

  /transactions/{id}/confirm:
    post:
      summary: Confirm a connectivity-critical transaction
      operationId: confirmTransaction
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Transaction committed }
        '409': { description: Transaction is not awaiting confirmation }

  /recovery/reconcile:
    post:
      summary: Explicitly retry canonical runtime reconciliation
      operationId: retryReconciliation
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': { description: Reconciliation verified }
        '503': { description: Recovery is still required }

  /import/pfsense/preview:
    post:
      summary: Preview a pfSense XML import
      operationId: previewPfSenseImport
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': { description: Redacted import preview }

  /import/pfsense/{id}/apply:
    post:
      summary: Apply a previously previewed pfSense import
      operationId: applyPfSenseImport
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Import applied }
        '202': { description: Import awaits connectivity confirmation }

  /backup/export:
    post:
      summary: Export an encrypted configuration backup
      operationId: exportBackup
      description: Version 2 encrypted portable backup includes router configuration and the network DNS policy when available. Current dashboard password encrypts the file. Downloaded lists and activity history are excluded. Restore on v0.2.0 or later.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: {type: string, format: password, minLength: 12, maxLength: 1024}
      responses:
        '200': { description: Encrypted backup }
        '401': { description: Current password verification failed }
        '422': { description: Password rejected or stale client supplied a different backup password }
        '503': { description: DNS policy is updating or could not be read consistently }

  /backup/import/preview:
    post:
      summary: Preview an encrypted backup import
      operationId: previewBackupImport
      description: Authenticates with the current dashboard password. Uses it for decryption unless backup_passphrase contains an older creation password or a legacy separate password. Supports v1 and v2 encrypted files. DNS policy is returned for a separate explicit restore after configuration confirmation.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup, current_password]
              properties:
                backup: {type: string, format: binary, description: Encrypted .mrbak file; maximum 16 MiB}
                current_password: {type: string, format: password}
                backup_passphrase: {type: string, format: password, description: Optional password used when this backup was created}
      responses:
        '200':
          description: Redacted backup preview with optional network DNS policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  import_id: {type: string}
                  expires_in_seconds: {type: integer}
                  candidate: {type: object, description: Redacted router configuration}
                  dns_filter: {$ref: '#/components/schemas/DNSFilterPolicy'}

  /import/backup/{id}/apply:
    post:
      summary: Apply a previously previewed backup
      operationId: applyBackupImport
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Backup applied }
        '202': { description: Backup awaits connectivity confirmation }

  /firmware/verify:
    post:
      summary: Verify a staged firmware manifest against the pinned trust anchor
      operationId: verifyFirmware
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': { description: Firmware signature verified }

  /network/wol:
    post:
      summary: Send a Wake-on-LAN magic packet to a LAN device
      operationId: wakeOnLAN
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': { description: Magic packet sent }
        '400': { description: Invalid JSON or not a 48-bit Ethernet MAC address }

  /qos/speedtest:
    post:
      summary: Measure real WAN download and upload speed, and suggest 90% QoS limits
      description: >-
        QoS shaping is bypassed for the duration of the measurement and the
        canonical configuration is reconciled afterwards
        (`qos_temporarily_bypassed`). Each phase stops after a fixed transfer
        time, so slow lines return a smaller sample instead of failing. Returns
        409 while another speed test is running.
      operationId: runSpeedTest
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Speed test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_mbps: { type: number }
                  upload_mbps: { type: number }
                  suggested_download_mbps: { type: integer }
                  suggested_upload_mbps: { type: integer }
        '409': { description: QoS must be disabled before measuring }
