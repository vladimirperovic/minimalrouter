openapi: 3.0.3
info:
  title: Minimal Router OS REST API
  description: Version 1 REST API contract for Minimal Router OS management plane (routerd).
  version: 1.0.0
servers:
  - url: https://192.168.1.1:8443/api/v1
    description: LAN HTTPS management endpoint
  - url: https://10.8.0.1:8443/api/v1
    description: Example authenticated WireGuard management endpoint

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mr_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

paths:
  /auth/login:
    post:
      summary: Authenticate administrator and establish session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 15
                totp_code:
                  type: string
                  description: Current TOTP code when TOTP is enabled
                read_only:
                  type: boolean
                  default: false
                  description: Issue a server-enforced observer session
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Invalid password
        '429':
          description: Rate limit exceeded (max 5 attempts per minute)

  /auth/logout:
    post:
      summary: Terminate active administrator session
      operationId: logout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Logged out successfully

  /auth/session:
    get:
      summary: Retrieve current session and CSRF token info
      operationId: getSessionInfo
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                  read_only:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  last_seen:
                    type: string
                    format: date-time

  /system:
    get:
      summary: Retrieve system health, CPU, memory, uptime, and metadata
      operationId: getSystemStatus
      security:
        - sessionCookie: []
      responses:
        '200':
          description: System status summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: string
                  public_ip:
                    type: string
                  last_backup:
                    type: string
                  last_snap:
                    type: string
                  update:
                    type: string

  /config:
    get:
      summary: Get active canonical configuration model
      operationId: getConfig
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Canonical configuration object
    put:
      summary: Submit configuration update and execute transaction pipeline
      operationId: updateConfig
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Transaction committed successfully
        '202':
          description: Provisionally applied; connectivity confirmation required
        '403':
          description: CSRF failure or read-only session
        '422':
          description: Validation or preflight check failed

  /snapshots:
    get:
      summary: List all immutable configuration snapshots
      operationId: listSnapshots
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of snapshots

  /snapshots/{id}/restore:
    post:
      summary: Restore a previous snapshot
      operationId: restoreSnapshot
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshot restored successfully

  /transactions/pending:
    get:
      summary: Get the provisionally active transaction, if any
      operationId: getPendingTransaction
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pending transaction metadata without configuration secrets

  /transactions/{id}/confirm:
    post:
      summary: Confirm connectivity and commit a provisional transaction
      operationId: confirmTransaction
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction committed
        '403':
          description: Confirmation did not arrive through required WireGuard path
        '409':
          description: Transaction is absent, expired, or not awaiting confirmation
