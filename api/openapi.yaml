openapi: 3.0.3
info:
  title: Minimal Router OS REST API
  description: Version 1 REST API contract for Minimal Router OS management plane (routerd).
  version: 1.1.0
servers:
  - url: https://192.168.1.1:8443/api/v1
    description: LAN HTTPS management endpoint
  - url: https://10.8.0.1:8443/api/v1
    description: Example authenticated WireGuard management endpoint

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mr_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    NetworkInterfaceStatus:
      type: object
      required: [name, carrier, kind, loopback]
      properties:
        name: {type: string, example: eth1}
        mac: {type: string, example: "02:00:00:00:00:11"}
        state: {type: string, example: up}
        carrier: {type: boolean}
        speed_mbps: {type: integer, minimum: 0}
        driver: {type: string}
        bus_path: {type: string}
        kind: {type: string, enum: [ethernet, wifi, virtual, loopback]}
        loopback: {type: boolean}
    StaticLease:
      type: object
      required: [id, hostname, mac, ip_address]
      properties:
        id: {type: string}
        hostname: {type: string}
        mac: {type: string, example: "02:00:00:00:00:10"}
        ip_address: {type: string, format: ipv4}
    AccessWindow:
      type: object
      required: [days, all_day]
      properties:
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: string
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        start: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        end: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        all_day: {type: boolean}
    DeviceProfile:
      type: object
      required: [id, name, enabled, access_mode, allowed_services, windows]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,47}$'}
        name: {type: string}
        enabled: {type: boolean}
        access_mode: {type: string, enum: [allow_all, allow_services]}
        allowed_services:
          type: array
          uniqueItems: true
          items: {type: string, enum: [youtube, steam]}
        windows:
          type: array
          maxItems: 21
          items: {$ref: '#/components/schemas/AccessWindow'}
    DeviceAssignment:
      type: object
      required: [id, hostname, mac, ip_address, zone, profile_id]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,47}$'}
        hostname: {type: string}
        mac: {type: string}
        ip_address: {type: string, format: ipv4}
        zone: {type: string, enum: [lan, iot]}
        profile_id: {type: string}
    DevicePolicyConfig:
      type: object
      required: [enabled, profiles, assignments]
      properties:
        enabled: {type: boolean}
        profiles:
          type: array
          items: {$ref: '#/components/schemas/DeviceProfile'}
        assignments:
          type: array
          items: {$ref: '#/components/schemas/DeviceAssignment'}
    IoTDHCPSettings:
      type: object
      required: [enabled, range_start, range_end, lease_time, static_leases]
      properties:
        enabled: {type: boolean}
        range_start: {type: string, format: ipv4}
        range_end: {type: string, format: ipv4}
        lease_time: {type: string, example: 12h}
        static_leases:
          type: array
          items: {$ref: '#/components/schemas/StaticLease'}
    IoTConfig:
      type: object
      description: Optional routed IPv4 zone isolated from the main LAN. VLAN mode requires an external managed-switch trunk.
      required: [enabled, mode, interface, ip_address, netmask, cidr, dhcp]
      properties:
        enabled: {type: boolean}
        mode: {type: string, enum: [dedicated, vlan]}
        interface: {type: string, description: Dedicated physical interface when mode=dedicated}
        parent_interface: {type: string, description: 802.1Q trunk parent when mode=vlan}
        vlan_id: {type: integer, minimum: 1, maximum: 4094}
        ip_address: {type: string, format: ipv4}
        netmask: {type: string, example: 255.255.255.0}
        cidr: {type: string, example: 192.168.30.1/24}
        dhcp: {$ref: '#/components/schemas/IoTDHCPSettings'}
    CanonicalConfig:
      type: object
      required: [revision, system, wan, lan, dhcp, firewall, wireguard, cloudflare, squid_proxy, adguard, qos, wifi, iot, device_policies]
      additionalProperties: true
      properties:
        revision: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
        system:
          type: object
          additionalProperties: true
          properties:
            timezone: {type: string, example: Europe/Belgrade}
        wan: {type: object, additionalProperties: true}
        lan: {type: object, additionalProperties: true}
        dhcp: {type: object, additionalProperties: true}
        firewall: {type: object, additionalProperties: true}
        wireguard: {type: object, additionalProperties: true}
        cloudflare: {type: object, additionalProperties: true}
        squid_proxy: {type: object, additionalProperties: true}
        adguard: {type: object, additionalProperties: true}
        qos: {type: object, additionalProperties: true}
        wifi: {type: object, additionalProperties: true}
        iot: {$ref: '#/components/schemas/IoTConfig'}
        device_policies: {$ref: '#/components/schemas/DevicePolicyConfig'}

paths:
  /auth/login:
    post:
      summary: Authenticate administrator and establish session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 15
                totp_code:
                  type: string
                  description: Current TOTP code when TOTP is enabled
                read_only:
                  type: boolean
                  default: false
                  description: Issue a server-enforced observer session
      responses:
        '200':
          description: Authenticated successfully
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Invalid password
        '429':
          description: Rate limit exceeded (max 5 attempts per minute)

  /auth/logout:
    post:
      summary: Terminate active administrator session
      operationId: logout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Logged out successfully

  /auth/session:
    get:
      summary: Retrieve current session and CSRF token info
      operationId: getSessionInfo
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                  read_only:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  last_seen:
                    type: string
                    format: date-time

  /system:
    get:
      summary: Retrieve system health, CPU, memory, uptime, and metadata
      operationId: getSystemStatus
      security:
        - sessionCookie: []
      responses:
        '200':
          description: System status summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [Connected, Disconnected]
                  version:
                    type: string
                  wan_iface:
                    type: string
                  lan_ip:
                    type: string
                  revision:
                    type: integer
                  update_trust_configured:
                    type: boolean
                  runtime:
                    type: object
                    description: Real Linux runtime telemetry; available=false in the macOS preview
                    properties:
                      dhcp_leases:
                        type: array
                        description: Current bounded dnsmasq IPv4 lease table; empty when unavailable
                        items:
                          type: object
                          required: [expires_at, mac, ip_address]
                          properties:
                            expires_at:
                              type: integer
                              format: int64
                            mac:
                              type: string
                            ip_address:
                              type: string
                              format: ipv4
                            hostname:
                              type: string
                      interfaces:
                        type: array
                        description: Stable operator-facing interface inventory used by setup and IoT selection.
                        items: {$ref: '#/components/schemas/NetworkInterfaceStatus'}

  /config:
    get:
      summary: Get active canonical configuration model
      operationId: getConfig
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Canonical configuration object
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CanonicalConfig'}
    put:
      summary: Submit configuration update and execute transaction pipeline
      operationId: updateConfig
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CanonicalConfig'}
      responses:
        '200':
          description: Transaction committed successfully
        '202':
          description: Provisionally applied; connectivity confirmation required
        '403':
          description: CSRF failure or read-only session
        '422':
          description: Validation or preflight check failed

  /snapshots:
    get:
      summary: List all immutable configuration snapshots
      operationId: listSnapshots
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of snapshots
    post:
      summary: Create an immutable checksummed configuration snapshot
      operationId: createSnapshot
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: Snapshot created

  /snapshots/{id}/restore:
    post:
      summary: Restore a previous snapshot
      operationId: restoreSnapshot
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshot restored successfully
        '202':
          description: Snapshot provisionally restored; connectivity confirmation required

  /wireguard/peers:
    post:
      summary: Provision a WireGuard peer and return its client configuration once
      description: The client private key is returned only in this no-store response and is never persisted.
      operationId: provisionWireGuardPeer
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, client_ip_address, server_endpoint]
              properties:
                name:
                  type: string
                client_ip_address:
                  type: string
                  example: 10.8.0.2
                server_endpoint:
                  type: string
                  example: router.example.net:51820
      responses:
        '200':
          description: Peer committed; one-time client .conf and PNG QR returned
        '409':
          description: WAN is not configured
        '422':
          description: Invalid or duplicate peer settings

  /audit/events:
    get:
      summary: List bounded metadata-only security audit events
      operationId: listAuditEvents
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Audit events without request bodies or secrets
        '403':
          description: Read-only sessions cannot inspect the administrator audit log

  /transactions/pending:
    get:
      summary: Get the provisionally active transaction, if any
      operationId: getPendingTransaction
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pending transaction metadata without configuration secrets

  /transactions/{id}/confirm:
    post:
      summary: Confirm connectivity and commit a provisional transaction
      operationId: confirmTransaction
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction committed
        '403':
          description: Confirmation did not arrive through required WireGuard path
        '409':
          description: Transaction is absent, expired, or not awaiting confirmation

  /setup/status:
    get:
      summary: Read first-run status and configured interface defaults
      operationId: getSetupStatus
      responses:
        '200':
          description: Setup status; contains no secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean}
                  wan_interface: {type: string}
                  lan_interface: {type: string}
                  lan_ip: {type: string, format: ipv4}
                  timezone: {type: string}
                  interfaces:
                    type: array
                    items: {$ref: '#/components/schemas/NetworkInterfaceStatus'}

  /setup/apply:
    post:
      summary: Perform first-run setup once
      operationId: applySetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wan_interface, lan_interface, admin_password, lan_ip_address]
              properties:
                wan_interface: {type: string}
                lan_interface: {type: string}
                pppoe_username: {type: string}
                pppoe_password: {type: string}
                admin_password: {type: string, minLength: 15, maxLength: 1024}
                lan_ip_address: {type: string, example: 192.168.1.1}
                timezone: {type: string, example: Europe/Belgrade}
      responses:
        '200': {description: Setup applied and initial session issued}
        '403': {description: Appliance is already configured}
        '422': {description: Input or privileged apply failed}
        '429': {description: Setup attempt rate-limited}

  /auth/change-password:
    post:
      summary: Change administrator password and revoke every session
      operationId: changePassword
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: {type: string}
                new_password: {type: string, minLength: 15, maxLength: 1024}
      responses:
        '200': {description: Password changed; caller must log in again}
        '401': {description: Current password is incorrect}

  /auth/totp/enroll:
    post:
      summary: Begin TOTP enrollment after password reauthentication
      operationId: enrollTOTP
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: {type: string}
      responses:
        '200': {description: One-time enrollment secret and URI}
        '401': {description: Current password is incorrect}
        '409': {description: TOTP is already enabled}

  /auth/totp/enable:
    post:
      summary: Confirm pending TOTP enrollment
      operationId: enableTOTP
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200': {description: TOTP enabled and every session revoked}
        '401': {description: Code is invalid or replayed}

  /auth/totp/disable:
    post:
      summary: Disable TOTP after password and TOTP verification
      operationId: disableTOTP
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, code]
              properties:
                current_password: {type: string}
                code: {type: string}
      responses:
        '200': {description: TOTP disabled and every session revoked}
        '401': {description: Password or code is invalid}

  /system/diagnostics:
    get:
      summary: Export a redacted diagnostic bundle
      operationId: exportDiagnostics
      security:
        - sessionCookie: []
      responses:
        '200': {description: Redacted JSON diagnostic attachment}

  /import/pfsense/preview:
    post:
      summary: Upload pfSense XML and create a session-bound preview
      operationId: previewPfSenseImport
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': {description: Bounded preview with unsupported items reported}
        '400': {description: Invalid or oversized XML}

  /import/pfsense/{id}/apply:
    post:
      summary: Apply a previously previewed pfSense import
      operationId: applyPfSenseImport
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Import transaction committed}
        '202': {description: Import awaits connectivity confirmation}
        '404': {description: Preview absent, expired, or belongs to another session}

  /backup/export:
    post:
      summary: Export an Argon2id/AES-256-GCM encrypted backup
      operationId: exportBackup
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, backup_passphrase]
              properties:
                current_password: {type: string}
                backup_passphrase: {type: string, minLength: 15}
      responses:
        '200': {description: Encrypted .mrbak attachment}
        '401': {description: Current password is incorrect}
        '422': {description: Backup passphrase is invalid}

  /backup/import/preview:
    post:
      summary: Authenticate, decrypt, validate, and preview a backup
      operationId: previewBackupImport
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [current_password, backup_passphrase, backup]
              properties:
                current_password: {type: string}
                backup_passphrase: {type: string}
                backup: {type: string, format: binary}
      responses:
        '200': {description: Session-bound restore preview}
        '401': {description: Current password is incorrect}
        '422': {description: Backup authentication or validation failed}

  /import/backup/{id}/apply:
    post:
      summary: Apply a previously previewed encrypted backup
      operationId: applyBackupImport
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Restore transaction committed}
        '202': {description: Restore awaits connectivity confirmation}
        '404': {description: Preview absent, expired, or belongs to another session}

  /firmware/verify:
    post:
      summary: Verify an offline firmware manifest with the provisioned key
      operationId: verifyFirmwareManifest
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200': {description: Signature accepted}
        '422': {description: Signature, manifest, or trust configuration rejected}
